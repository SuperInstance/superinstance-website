<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fleet Search — The SuperInstance Ecosystem Explorer</title>
<style>
  :root {
    --bg: #0a0e1a; --panel: #131829; --text: #d8e2ff;
    --dim: #6e7a99; --accent: #66ffd9;
  }
  * { box-sizing: border-box; }
  body { background: radial-gradient(ellipse at top, #1a0e2a, #0a0e1a 70%); color: var(--text); font-family: 'SF Mono', monospace; margin: 0; padding: 0; min-height: 100vh; }
  .wrap { max-width: 1300px; margin: 0 auto; padding: 2rem 1.5rem; }
  h1 { font-size: 1.8rem; color: var(--accent); margin: 0 0 0.5rem; }
  .subtitle { color: var(--dim); font-size: 0.9rem; margin-bottom: 1.5rem; }
  .search-bar { width: 100%; padding: 0.75rem 1rem; background: var(--panel); border: 1px solid var(--accent); border-radius: 8px; color: var(--text); font-family: inherit; font-size: 1rem; }
  .filters { display: flex; gap: 0.5rem; margin: 1rem 0; flex-wrap: wrap; }
  .filter { background: var(--panel); border: 1px solid #1f2640; color: var(--text); padding: 0.4rem 0.8rem; border-radius: 16px; font-size: 0.8rem; cursor: pointer; font-family: inherit; }
  .filter.active { background: var(--accent); color: #0a0e1a; }
  .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 0.75rem; margin-top: 1rem; }
  .result { background: var(--panel); border: 1px solid #1f2640; border-left: 3px solid var(--accent); border-radius: 4px; padding: 0.75rem; }
  .result .name { font-weight: 600; color: var(--accent); }
  .result .name a { color: var(--accent); text-decoration: none; }
  .result .name a:hover { text-decoration: underline; }
  .result .desc { font-size: 0.8rem; margin: 0.3rem 0; color: var(--text); }
  .result .meta { font-size: 0.7rem; color: var(--dim); margin-top: 0.3rem; }
  .result .bridged { display: inline-block; padding: 0.1rem 0.4rem; background: #2a1f4a; color: var(--accent); border-radius: 8px; font-size: 0.7rem; margin-right: 0.3rem; }
  .result .not-bridged { display: inline-block; padding: 0.1rem 0.4rem; background: #1a1f3a; color: var(--dim); border-radius: 8px; font-size: 0.7rem; }
  .panel { background: var(--panel); border: 1px solid #1f2640; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
  .stats { display: flex; gap: 1rem; margin: 1rem 0; flex-wrap: wrap; }
  .stat-pill { background: #0a0e1a; padding: 0.5rem 0.75rem; border-radius: 4px; }
  .stat-pill .num { color: var(--accent); font-weight: 700; font-size: 1.2rem; }
  .stat-pill .label { color: var(--dim); font-size: 0.7rem; }
</style>
</head>
<body>
<div class="wrap">

<h1>🔍 Fleet Search</h1>

<input type="text" class="search-bar" id="searchInput" placeholder="Search repos (e.g. elephant, vessel, mermaid, conservation, claude, mind, holodeck)..." />

<div class="stats">
  <div class="stat-pill"><div class="num">700+</div><div class="label">repos scouted</div></div>
  <div class="stat-pill"><div class="num">51</div><div class="label">bridges live</div></div>
  <div class="stat-pill"><div class="num">18</div><div class="label">substrates</div></div>
  <div class="stat-pill"><div class="num" id="resultCount">0</div><div class="label">matching</div></div>
</div>

<div class="filters" id="filters"></div>

<div class="results" id="results"></div>

</div>

let activeFilter = null;

function renderFilters() {
  const el = document.getElementById('filters');
  el.innerHTML = '<button class="filter active" onclick="setFilter(null)">all</button>' + 
    ALL_FAMILIES.map(f => 
      `<button class="filter ${activeFilter === f.prefix ? 'active' : ''}" onclick="setFilter('${f.prefix}')">${f.name}${f.bridged ? '' : ' (TBD)'}</button>`
    ).join('');
}

function setFilter(prefix) {
  activeFilter = prefix;
  renderFilters();
  search();
}

function search() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const el = document.getElementById('results');
  let results = [];
  
  // If filter is set, only show that family
  if (activeFilter) {
    const family = ALL_FAMILIES.find(f => f.prefix === activeFilter);
    const sample = SAMPLE_REPOS[activeFilter] || [];
    for (const repo of sample) {
      if (q === '' || repo.toLowerCase().includes(q)) {
        const desc = DESCRIPTIONS[repo] || `${family.name} repository. Part of the SuperInstance ecosystem.`;
        results.push({name: repo, desc, family, bridged: family.bridged});
      }
    }
  } else {
    // Search across all known repos
    const allRepos = [];
    for (const [prefix, samples] of Object.entries(SAMPLE_REPOS)) {
      const family = ALL_FAMILIES.find(f => f.prefix === prefix);
      for (const repo of samples) {
        if (repo.toLowerCase().includes(q) || q === '') {
          allRepos.push({name: repo, desc: DESCRIPTIONS[repo] || '', family});
        }
      }
    }
    // Add individual major repos
    for (const [repo, desc] of Object.entries(DESCRIPTIONS)) {
      if (repo.toLowerCase().includes(q) || q === '') {
        if (!allRepos.find(r => r.name === repo)) {
          allRepos.push({name: repo, desc, family: ALL_FAMILIES.find(f => f.prefix === repo.split('-')[0]) || {name: 'individual'}});
        }
      }
    }
    results = allRepos.slice(0, 50);
  }
  
  document.getElementById('resultCount').textContent = results.length;
  el.innerHTML = results.map(r => `
    <div class="result">
      <div class="name">
        ${r.bridged ? '<span class="bridged">bridged</span>' : '<span class="not-bridged">TBD</span>'}
        <a href="https://github.com/SuperInstance/${r.name}" target="_blank">${r.name}</a>
      </div>
      <div class="desc">${r.desc || 'Part of the SuperInstance ecosystem.'}</div>
      <div class="meta">${r.family?.name || ''}</div>
    </div>
  `).join('');
}

document.getElementById('searchInput').oninput = search;
renderFilters();
search();
