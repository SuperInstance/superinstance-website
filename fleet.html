<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Fleet</title>
  <style>
    :root {
      --bg: #0a111f;
      --text: #a0b8d8;
      --accent: #4a75a8;
      --ship: #f0f0f0;
      --glow: #5e9cd9;
      --grid: #152238;
      --shadow: rgba(0, 0, 0, 0.7);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Courier New', monospace;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .header {
      background: linear-gradient(to right, var(--bg), var(--grid));
      padding: 2rem 4rem;
      border-bottom: 1px solid var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 10;
      text-shadow: 0 0 8px var(--glow);
    }

    .header h1 {
      font-size: 4rem;
      font-weight: 900;
      letter-spacing: -1px;
      color: var(--ship);
      text-transform: uppercase;
      text-shadow: 0 0 12px var(--glow);
    }

    .header .subtitle {
      font-size: 1.2rem;
      color: var(--accent);
      font-weight: 300;
      letter-spacing: 1px;
    }

    .fleet {
      flex: 1;
      position: relative;
      overflow: hidden;
      padding: 2rem;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(30, 50, 90, 0.1) 0%, transparent 20%),
        radial-gradient(circle at 90% 80%, rgba(30, 50, 90, 0.1) 0%, transparent 20%);
    }

    .grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(20, 30, 50, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(20, 30, 50, 0.1) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.3;
    }

    .ship {
      position: absolute;
      width: 24px;
      height: 40px;
      background: var(--ship);
      border-radius: 4px;
      box-shadow: 
        0 0 6px var(--glow),
        0 0 12px var(--glow),
        inset 0 0 8px rgba(255, 255, 255, 0.3);
      clip-path: polygon(0 0, 100% 0, 100% 60%, 70% 60%, 70% 100%, 30% 100%, 30% 60%, 0 60%);
      transition: transform 8s ease-out, opacity 4s ease;
      filter: drop-shadow(0 0 8px var(--glow));
    }

    .ship::before {
      content: "";
      position: absolute;
      top: 5px;
      left: 5px;
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--glow);
    }

    .ship::after {
      content: "";
      position: absolute;
      top: 50%;
      right: -12px;
      width: 20px;
      height: 6px;
      background: var(--glow);
      border-radius: 3px;
      transform: translateY(-50%);
      opacity: 0.7;
      box-shadow: 0 0 10px var(--glow);
      animation: flame 1.5s infinite ease-in-out;
    }

    @keyframes flame {
      0%, 100% { height: 6px; opacity: 0.7; }
      50% { height: 12px; opacity: 1; }
    }

    .ship.pulse {
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 6px var(--glow), 0 0 12px var(--glow); }
      50% { transform: scale(1.1); box-shadow: 0 0 10px var(--glow), 0 0 20px var(--glow); }
    }

    .ship.active {
      box-shadow: 
        0 0 8px var(--glow),
        0 0 16px var(--glow),
        0 0 24px var(--glow),
        0 0 32px var(--glow);
      filter: drop-shadow(0 0 16px var(--glow));
    }

    .ship-label {
      position: absolute;
      bottom: -22px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.8rem;
      color: var(--accent);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.5s ease;
      text-shadow: 0 0 4px rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }

    .ship:hover .ship-label {
      opacity: 1;
    }

    .watch {
      position: absolute;
      bottom: 2rem;
      right: 2rem;
      font-size: 0.9rem;
      color: var(--accent);
      letter-spacing: 1px;
      text-transform: uppercase;
      background: rgba(10, 20, 35, 0.7);
      padding: 0.7rem 1.5rem;
      border-radius: 4px;
      border: 1px solid var(--accent);
      backdrop-filter: blur(5px);
      box-shadow: 0 0 10px var(--shadow);
    }

    .watch .time {
      font-weight: bold;
      color: var(--ship);
      text-shadow: 0 0 6px var(--glow);
    }

    .ship.active .ship-label {
      color: var(--ship);
      text-shadow: 0 0 6px var(--glow);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>THE FLEET</h1>
    <div class="subtitle">A visual showing the federation of agents. Each agent is a ship. Each ship is a cell. The fleet sails the watch.</div>
  </div>

  <div class="fleet">
    <div class="grid"></div>
    <div class="watch">
      <span class="time" id="watch-time">00:00:00</span>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const fleet = document.querySelector('.fleet');
      const timeDisplay = document.getElementById('watch-time');
      const shipCount = 24;
      
      // Generate ships
      const ships = [];
      for (let i = 0; i < shipCount; i++) {
        const ship = document.createElement('div');
        ship.className = 'ship';
        
        // Random position
        const x = Math.random() * (window.innerWidth - 50);
        const y = Math.random() * (window.innerHeight - 100) + 50;
        
        ship.style.left = `${x}px`;
        ship.style.top = `${y}px`;
        
        // Add label
        const label = document.createElement('div');
        label.className = 'ship-label';
        label.textContent = `CELL-${i.toString().padStart(3, '0')}`;
        ship.appendChild(label);
        
        // Add to DOM and ships array
        fleet.appendChild(ship);
        ships.push({
          element: ship,
          x,
          y,
          vx: (Math.random() - 0.5) * 0.5,
          vy: (Math.random() - 0.5) * 0.5,
          pulse: Math.random() > 0.5,
          active: Math.random() > 0.7,
          lastPulse: Date.now(),
          lastActive: Date.now()
        });
      }

      // Update time
      function updateTime() {
        const now = new Date();
        const hours = now.getHours().toString().padStart(2, '0');
        const minutes = now.getMinutes().toString().padStart(2, '0');
        const seconds = now.getSeconds().toString().padStart(2, '0');
        timeDisplay.textContent = `${hours}:${minutes}:${seconds}`;
      }

      // Animation loop
      function animate() {
        const now = Date.now();
        
        ships.forEach(ship => {
          // Movement with slight drift
          ship.x += ship.vx;
          ship.y += ship.vy;
          
          // Bounce off edges
          if (ship.x < 0 || ship.x > window.innerWidth - 24) {
            ship.vx *= -1;
            ship.x = Math.max(0, Math.min(window.innerWidth - 24, ship.x));
          }
          if (ship.y < 0 || ship.y > window.innerHeight - 40) {
            ship.vy *= -1;
            ship.y = Math.max(0, Math.min(window.innerHeight - 40, ship.y));
          }
          
          // Update position
          ship.element.style.left = `${ship.x}px`;
          ship.element.style.top = `${ship.y}px`;
          
          // Pulse effect
          if (ship.pulse && now - ship.lastPulse > 1000 + Math.random() * 3000) {
            ship.element.classList.add('pulse');
            ship.lastPulse = now;
            setTimeout(() => {
              ship.element.classList.remove('pulse');
            }, 1000);
          }
          
          // Active state
          if (now - ship.lastActive > 5000 + Math.random() * 8000) {
            ship.active = Math.random() > 0.85;
            ship.lastActive = now;
            
            if (ship.active) {
              ship.element.classList.add('active');
            } else {
              ship.element.classList.remove('active');
            }
          }
        });
        
        // Update time
        updateTime();
        
        requestAnimationFrame(animate);
      }

      // Start animation
      animate();

      // Resize handling
      window.addEventListener('resize', () => {
        // Keep ships within bounds
        ships.forEach(ship => {
          ship.x = Math.max(0, Math.min(window.innerWidth - 24, ship.x));
          ship.y = Math.max(0, Math.min(window.innerHeight - 40, ship.y));
          ship.element.style.left = `${ship.x}px`;
          ship.element.style.top = `${ship.y}px`;
        });
      });
    });
  </script>
</body>
</html>
