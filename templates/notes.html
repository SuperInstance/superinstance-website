<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes — Quilt Click-and-Go Template</title>
<meta name="description" content="A self-contained note-taking app. Cells with title, content, tags. Search and export.">
<style>
:root{--bg:#0a0a14;--panel:#14141f;--pe:#1a1a26;--b:#252535;--bs:#353548;--t:#f0f0f5;--td:#a0a0b0;--tf:#6a6a7a;--ok:#7ec699;--bad:#ff6b6b;--a1:#7c3aed;--a2:#3b82f6;--a3:#10b981;--a4:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.5;font-size:14px;height:100%}
.m{font-family:'SF Mono','JetBrains Mono',monospace}
.wrap{max-width:1200px;margin:0 auto;padding:20px;height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
h1{font-size:1.6rem;font-weight:800}
h1 .accent{color:var(--a4)}
.sub{color:var(--td);font-size:.85rem;margin-top:3px}
.coffee{background:linear-gradient(135deg,#FFDD00 0%,#fbbf24 100%);color:#422006;padding:7px 12px;border-radius:6px;font-weight:700;font-size:.78rem;text-decoration:none;font-family:'JetBrains Mono',monospace}
.coffee:hover{filter:brightness(1.1);color:#422006}
.nav{background:rgba(124,58,237,.05);border:1px solid var(--b);border-radius:7px;padding:9px 11px;margin-bottom:14px;font-size:.78rem}
.nav a{color:var(--a2);text-decoration:none;margin-right:11px;white-space:nowrap}
.nav a:hover{text-decoration:underline}
.nav a.cur{color:var(--a3);font-weight:700}
.toolbar{display:flex;gap:6px;flex-wrap:wrap}
.btn{padding:7px 12px;border-radius:6px;border:1px solid var(--b);background:var(--pe);color:var(--t);font-size:.78rem;cursor:pointer;font-weight:500;font-family:inherit}
.btn:hover{background:var(--bs);border-color:var(--bs)}
.btn-pri{background:var(--a4);border-color:var(--a4);color:#000}
.btn-pri:hover{filter:brightness(1.1)}
.btn-ok{background:var(--a3);border-color:var(--a3);color:#000}
.btn-ok:hover{filter:brightness(1.1)}
.btn-bad{background:transparent;border:1px solid var(--b);color:var(--bad)}
.btn-bad:hover{background:var(--bad);color:#fff;border-color:var(--bad)}
.search{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.search input,.search select{flex:1;min-width:140px;background:var(--panel);border:1px solid var(--b);color:var(--t);padding:7px 10px;border-radius:5px;font-size:.85rem;font-family:inherit}
.search input:focus,.search select:focus{outline:none;border-color:var(--a4)}
.layout{flex:1;display:grid;grid-template-columns:280px 1fr;gap:14px;min-height:0}
@media(max-width:800px){.layout{grid-template-columns:1fr;height:auto}}
.list{background:var(--panel);border:1px solid var(--b);border-radius:8px;padding:10px;overflow-y:auto;max-height:75vh}
.note-row{padding:9px 10px;border-radius:5px;cursor:pointer;margin-bottom:4px;border:1px solid transparent}
.note-row:hover{background:var(--pe);border-color:var(--b)}
.note-row.active{background:rgba(245,158,11,.1);border-color:var(--a4)}
.note-row .ttl{font-size:.9rem;font-weight:600;color:var(--t);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-row .meta{font-size:.7rem;color:var(--tf);display:flex;gap:5px;flex-wrap:wrap}
.note-row .tag{background:rgba(124,58,237,.15);color:var(--a1);padding:1px 5px;border-radius:3px;font-family:'JetBrains Mono',monospace;font-size:.65rem}
.empty{color:var(--tf);text-align:center;padding:24px;font-style:italic;font-size:.85rem}
.editor{background:var(--panel);border:1px solid var(--b);border-radius:8px;padding:16px;display:flex;flex-direction:column;min-height:0}
.editor .trow{display:flex;gap:8px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
.editor input.ttl{flex:1;min-width:200px;background:transparent;border:1px solid transparent;color:var(--t);padding:6px 8px;font-size:1.1rem;font-weight:600;font-family:inherit;border-radius:4px}
.editor input.ttl:hover,.editor input.ttl:focus{background:var(--bg);border-color:var(--b);outline:none}
.editor input.tags{background:var(--bg);border:1px solid var(--b);color:var(--t);padding:6px 9px;border-radius:4px;font-size:.8rem;font-family:inherit;width:280px}
.editor input.tags:focus{outline:none;border-color:var(--a4)}
.mode{display:flex;gap:4px}
.mode button{padding:4px 10px;border:1px solid var(--b);background:var(--pe);color:var(--td);border-radius:4px;cursor:pointer;font-size:.72rem;font-family:'JetBrains Mono',monospace}
.mode button.on{background:var(--a4);color:#000;border-color:var(--a4)}
.body{flex:1;display:grid;grid-template-rows:1fr;min-height:280px}
.body textarea,.body .preview{width:100%;height:100%;background:var(--bg);border:1px solid var(--b);color:var(--t);padding:12px;border-radius:5px;font-size:.9rem;font-family:inherit;line-height:1.6;resize:none;overflow-y:auto}
.body textarea:focus{outline:none;border-color:var(--a4)}
.body .preview{padding:14px 16px}
.body .preview h1{font-size:1.4rem;margin:.5em 0 .3em;color:var(--a1)}
.body .preview h2{font-size:1.2rem;margin:.5em 0 .3em;color:var(--a2)}
.body .preview h3{font-size:1.05rem;margin:.5em 0 .3em;color:var(--a3)}
.body .preview p{margin:.4em 0}
.body .preview code{background:var(--pe);padding:1px 5px;border-radius:3px;font-family:'JetBrains Mono',monospace;color:var(--a4);font-size:.85em}
.body .preview pre{background:var(--pe);border:1px solid var(--b);padding:10px;border-radius:5px;margin:.6em 0;overflow-x:auto}
.body .preview pre code{background:transparent;padding:0;color:var(--t)}
.body .preview ul,.body .preview ol{margin:.4em 0 .4em 1.4em}
.body .preview blockquote{border-left:3px solid var(--a1);padding:2px 12px;color:var(--td);margin:.6em 0;background:rgba(124,58,237,.05)}
.body .preview hr{border:none;border-top:1px solid var(--b);margin:.8em 0}
.body .preview a{color:var(--a2);text-decoration:underline}
.body .preview strong{color:var(--t);font-weight:700}
.body .preview em{color:var(--td)}
.body .empty-preview{color:var(--tf);text-align:center;padding:60px 20px;font-style:italic}
.bar{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:.7rem;color:var(--tf);flex-wrap:wrap;gap:6px}
.bar .actions{display:flex;gap:6px}
.bar .actions .btn{padding:4px 9px;font-size:.72rem}
.totals{background:var(--panel);border:1px solid var(--b);border-radius:8px;padding:12px;margin-bottom:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.totals .lbl{color:var(--td);font-size:.65rem;text-transform:uppercase;letter-spacing:.06em}
.totals .val{font-family:'SF Mono',monospace;font-size:1.1rem;font-weight:700;color:var(--a3)}
footer{text-align:center;padding:14px 0;color:var(--tf);font-size:.72rem;font-family:'SF Mono','JetBrains Mono',monospace;border-top:1px solid var(--b);margin-top:12px}
footer a{color:var(--a1);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div>
    <h1>📝 <span class="accent">Notes</span> <span style="color:var(--td);font-size:.85rem;font-weight:400">— a Quilt click-and-go</span></h1>
    <div class="sub">Title, content, tags. Search. Markdown-lite. Saves to your browser.</div>
  </div>
  <div class="toolbar">
    <button class="btn" onclick="exportJSON()">↓ Export</button>
    <button class="btn" onclick="importJSON()">↑ Import</button>
    <button class="btn btn-pri" onclick="newNote()">+ New note</button>
    <a class="coffee" href="https://www.buymeacoffee.com/CaseyDiGennaro" target="_blank">☕ Buy Casey a Coffee</a>
  </div>
</header>

<nav class="nav">
  <a href="../index.html">Home</a>
  <a href="../workspace.html">Workspace</a>
  <a href="../playground.html">Playground</a>
  <a href="../pincher.html">Pincher</a>
  <a href="../vibe.html">Vibe</a>
  <a href="../cron-builder.html">Cron</a>
  <a href="../token-calculator.html">Tokens</a>
  <a href="../json-to-sheet.html">JSON→Sheet</a>
  <a href="../regex.html">Regex</a>
  <a href="../debugger.html">Inspector</a>
  <a href="notes.html" class="cur">Notes</a>
</nav>

<div class="totals" id="totals"></div>

<div class="search">
  <input id="q" placeholder="Search title, content, or #tag…" oninput="render()">
  <select id="tagfilter" onchange="render()"><option value="">All tags</option></select>
  <select id="sort" onchange="render()">
    <option value="updated">Sort: updated</option>
    <option value="created">Sort: created</option>
    <option value="title">Sort: title</option>
  </select>
</div>

<div class="layout">
  <div class="list" id="list"></div>
  <div class="editor" id="editor"></div>
</div>

</div>

<footer>
  Quilt-powered · <a href="../workspace.html">more tools</a> · saves to localStorage
</footer>

<script>
const STORAGE_KEY = 'quilt-notes-v1';

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}

function save(data) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {} }

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function now() { return Date.now(); }

function sampleData() {
  const t = now();
  return {
    notes: [
      { id: uid(), title: 'Welcome to Notes', tags: ['intro','help'], body: '# Welcome\n\nThis is a **cell** in your notebook. Each note has:\n\n- A **title**\n- **Tags** (comma separated)\n- A **body** with *markdown-lite* formatting\n\n## Supported formatting\n\nUse `# heading`, `## subheading`, `### smaller`.\nUse `**bold**`, `*italic*`, `` `code` ``.\nUse `- bullet` or `1. numbered` for lists.\nUse `> quote` for blockquotes.\nUse `---` for a divider.\n\nClick **New note** to start a fresh one. Click the toggle to switch between edit and preview.', created: t - 5000, updated: t - 1000 },
      { id: uid(), title: 'Grocery list', tags: ['home','todo'], body: '# Grocery\n\n- [ ] Eggs\n- [ ] Bread\n- [ ] Coffee beans\n- [x] Milk\n\nRun to the *corner store* on 5th.', created: t - 100000, updated: t - 80000 },
      { id: uid(), title: 'Project: tent demo', tags: ['work','demo'], body: '## Goal\nShip a working demo of the tent-cell library by end of month.\n\n### Steps\n1. Get the canvas rendering at 60fps\n2. Wire up the formula cells\n3. Add a basic test sheet\n4. Write a one-pager\n\n> Block time on Tuesday afternoon for the writeup.', created: t - 300000, updated: t - 200000 },
      { id: uid(), title: 'Reading list', tags: ['books','ideas'], body: '# Reading\n\n- *The Beginning of Infinity* — Deutsch\n- *Gödel, Escher, Bach* — Hofstadter\n- *Tools and Weapons* — Brad Smith\n\n> "Every new idea is a small step backward in some other direction."', created: t - 600000, updated: t - 500000 }
    ],
    activeId: null
  };
}

let data = load() || sampleData();
if (!data.activeId && data.notes.length) data.activeId = data.notes[0].id;
save(data);

let activeMode = 'edit'; // 'edit' or 'preview'

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderMarkdown(s) {
  // First escape, then apply transformations on escaped text (so <script> becomes &lt;script&gt;)
  let out = escapeHTML(s);
  // code blocks ```...```
  out = out.replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${code.trim()}</code></pre>`);
  // inline code
  out = out.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  // headings
  out = out.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  out = out.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  out = out.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // horizontal rule
  out = out.replace(/^---+$/gm, '<hr>');
  // blockquote
  out = out.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  // lists (simple)
  // unordered: lines starting with - or *
  out = out.replace(/(^|\n)((?:[-*] .+(?:\n|$))+)/g, (m, pre, block) => {
    const items = block.trim().split('\n').map(l => `<li>${l.replace(/^[-*] /, '')}</li>`).join('');
    return pre + '<ul>' + items + '</ul>';
  });
  // ordered: lines starting with "1. "
  out = out.replace(/(^|\n)((?:\d+\. .+(?:\n|$))+)/g, (m, pre, block) => {
    const items = block.trim().split('\n').map(l => `<li>${l.replace(/^\d+\. /, '')}</li>`).join('');
    return pre + '<ol>' + items + '</ol>';
  });
  // bold then italic
  out = out.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  // links [text](url)
  out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // paragraphs: lines that aren't already wrapped
  out = out.split(/\n{2,}/).map(block => {
    if (/^\s*<(h\d|ul|ol|li|blockquote|pre|hr|p)/i.test(block)) return block;
    return '<p>' + block.replace(/\n/g, '<br>') + '</p>';
  }).join('\n');
  return out;
}

function allTags() {
  const set = new Set();
  for (const n of data.notes) for (const t of (n.tags || [])) set.add(t);
  return Array.from(set).sort();
}

function getFiltered() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const tagF = document.getElementById('tagfilter').value;
  const sort = document.getElementById('sort').value;
  let list = data.notes.slice();
  if (q) {
    list = list.filter(n =>
      n.title.toLowerCase().includes(q) ||
      n.body.toLowerCase().includes(q) ||
      (n.tags || []).some(t => t.toLowerCase().includes(q)) ||
      ('#' + (n.tags||[]).join(' #')).toLowerCase().includes(q)
    );
  }
  if (tagF) list = list.filter(n => (n.tags || []).includes(tagF));
  if (sort === 'updated') list.sort((a, b) => b.updated - a.updated);
  else if (sort === 'created') list.sort((a, b) => b.created - a.created);
  else if (sort === 'title') list.sort((a, b) => a.title.localeCompare(b.title));
  return list;
}

function renderTagFilter() {
  const sel = document.getElementById('tagfilter');
  const cur = sel.value;
  sel.innerHTML = '<option value="">All tags</option>' + allTags().map(t => `<option ${t===cur?'selected':''}>#${escapeHTML(t)}</option>`).join('');
}

function renderTotals() {
  const total = data.notes.length;
  const tags = allTags().length;
  const words = data.notes.reduce((s, n) => s + (n.body.match(/\b\w+\b/g) || []).length, 0);
  const last = data.notes.length ? new Date(Math.max(...data.notes.map(n => n.updated))).toLocaleString() : '—';
  document.getElementById('totals').innerHTML = `
    <div><div class="lbl">Notes</div><div class="val">${total}</div></div>
    <div><div class="lbl">Tags</div><div class="val">${tags}</div></div>
    <div><div class="lbl">Words</div><div class="val">${words.toLocaleString()}</div></div>
    <div><div class="lbl">Last edit</div><div class="val" style="font-size:.85rem">${escapeHTML(last)}</div></div>
  `;
}

function renderList() {
  const list = getFiltered();
  const wrap = document.getElementById('list');
  if (!list.length) {
    wrap.innerHTML = '<div class="empty">No notes match.</div>';
    return;
  }
  wrap.innerHTML = list.map(n => {
    const tagHTML = (n.tags || []).slice(0,3).map(t => `<span class="tag">#${escapeHTML(t)}</span>`).join('');
    return `<div class="note-row ${n.id===data.activeId?'active':''}" onclick="selectNote('${n.id}')">
      <div class="ttl">${escapeHTML(n.title || 'Untitled')}</div>
      <div class="meta">${tagHTML}<span style="margin-left:auto">${new Date(n.updated).toLocaleDateString()}</span></div>
    </div>`;
  }).join('');
}

function renderEditor() {
  const wrap = document.getElementById('editor');
  const n = data.notes.find(x => x.id === data.activeId);
  if (!n) {
    wrap.innerHTML = '<div class="empty" style="margin:auto">No note selected. Click "New note" or pick one from the list.</div>';
    return;
  }
  const tagStr = (n.tags || []).join(', ');
  wrap.innerHTML = `
    <div class="trow">
      <input class="ttl" value="${escapeHTML(n.title)}" oninput="updateField('${n.id}','title',this.value)" placeholder="Untitled">
      <input class="tags" value="${escapeHTML(tagStr)}" oninput="updateTags('${n.id}', this.value)" placeholder="comma, separated, tags">
      <div class="mode">
        <button class="${activeMode==='edit'?'on':''}" onclick="setMode('edit')">Edit</button>
        <button class="${activeMode==='preview'?'on':''}" onclick="setMode('preview')">Preview</button>
      </div>
    </div>
    <div class="body">
      ${activeMode==='edit'
        ? `<textarea id="body-area" placeholder="Write something…" oninput="updateField('${n.id}','body',this.value)">${escapeHTML(n.body)}</textarea>`
        : (n.body.trim() ? `<div class="preview">${renderMarkdown(n.body)}</div>` : '<div class="empty-preview">Nothing to preview yet.</div>')}
    </div>
    <div class="bar">
      <div>Created ${new Date(n.created).toLocaleString()} · Updated ${new Date(n.updated).toLocaleString()}</div>
      <div class="actions">
        <button class="btn" onclick="duplicateNote('${n.id}')">Duplicate</button>
        <button class="btn btn-bad" onclick="deleteNote('${n.id}')">Delete</button>
      </div>
    </div>
  `;
}

function render() {
  renderTagFilter();
  renderTotals();
  renderList();
  renderEditor();
}

function setMode(m) { activeMode = m; render(); }

function selectNote(id) { data.activeId = id; save(data); render(); }

function newNote() {
  const n = { id: uid(), title: 'Untitled', tags: [], body: '', created: now(), updated: now() };
  data.notes.unshift(n);
  data.activeId = n.id;
  activeMode = 'edit';
  save(data);
  render();
}

function updateField(id, field, value) {
  const n = data.notes.find(x => x.id === id);
  if (!n) return;
  n[field] = value;
  n.updated = now();
  save(data);
  if (field === 'title') renderList();
}

function updateTags(id, value) {
  const n = data.notes.find(x => x.id === id);
  if (!n) return;
  n.tags = value.split(',').map(t => t.trim()).filter(Boolean);
  n.updated = now();
  save(data);
  renderTagFilter();
  renderList();
}

function deleteNote(id) {
  if (!confirm('Delete this note?')) return;
  data.notes = data.notes.filter(n => n.id !== id);
  if (data.activeId === id) data.activeId = data.notes.length ? data.notes[0].id : null;
  save(data);
  render();
}

function duplicateNote(id) {
  const n = data.notes.find(x => x.id === id);
  if (!n) return;
  const copy = { ...n, id: uid(), title: n.title + ' (copy)', created: now(), updated: now() };
  data.notes.unshift(copy);
  data.activeId = copy.id;
  save(data);
  render();
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `quilt-notes-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importJSON() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json';
  input.onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const obj = JSON.parse(ev.target.result);
        if (obj && Array.isArray(obj.notes)) {
          data = obj;
          if (!data.activeId && data.notes.length) data.activeId = data.notes[0].id;
          save(data);
          render();
          alert(`Imported ${data.notes.length} notes.`);
        } else { alert('Invalid notes file.'); }
      } catch (err) { alert('Invalid JSON: ' + err.message); }
    };
    reader.readAsText(f);
  };
  input.click();
}

render();
</script>
</body>
</html>
