<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Echogram</title>
  <style>
    :root {
      --bg: #0a1929;
      --text: #c0d6e4;
      --accent: #d4a857;
      --dark: #0d1a2d;
      --mid: #1a2e46;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Courier New', monospace;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }
    header {
      padding: 1.5rem 2rem;
      text-align: center;
      border-bottom: 1px solid var(--accent);
      background-color: var(--dark);
      position: relative;
    }
    h1 {
      margin: 0;
      font-size: 2.5rem;
      letter-spacing: 1px;
      color: var(--accent);
    }
    .subtitle {
      margin-top: 0.5rem;
      font-size: 1rem;
      opacity: 0.8;
      font-style: italic;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin: 1rem 0;
      flex-wrap: wrap;
    }
    button {
      background-color: var(--mid);
      color: var(--text);
      border: 1px solid var(--accent);
      padding: 0.7rem 1.5rem;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      border-radius: 4px;
    }
    button:hover {
      background-color: var(--dark);
      transform: translateY(-1px);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 1rem;
      padding: 1rem;
      flex-grow: 1;
      overflow-y: auto;
      box-sizing: border-box;
    }
    .boat {
      background-color: var(--mid);
      border: 1px solid var(--accent);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      height: 300px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .boat-name {
      padding: 0.5rem 0.8rem;
      font-size: 0.85rem;
      background-color: var(--dark);
      text-align: center;
      border-bottom: 1px solid var(--accent);
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent);
    }
    .echogram {
      width: 100%;
      height: 260px;
      background-color: transparent;
      border: none;
      display: block;
      margin: 0;
      overflow: hidden;
    }
    .projection {
      margin-top: 1.5rem;
      height: 250px;
      perspective: 1000px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .projection-container {
      transform-style: preserve-3d;
      height: 100%;
      width: 100%;
      transform: rotateX(30deg) rotateY(0deg);
      transition: transform 0.5s ease;
      position: relative;
    }
    .echogram-3d {
      position: absolute;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      left: 0;
      top: 0;
    }
    .echogram-3d canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform-origin: center bottom;
      transform: translateY(0);
      opacity: 0.8;
    }
    .indicator {
      text-align: center;
      font-size: 0.9rem;
      margin-top: 1rem;
      color: var(--accent);
      font-weight: bold;
    }
    .legend {
      margin-top: 1.5rem;
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
      font-size: 0.9rem;
      opacity: 0.9;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .rotation {
      cursor: pointer;
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: var(--accent);
      text-align: center;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>The Echogram</h1>
    <p class="subtitle">higher abstractions emerge from scaled sensors</p>
    <div class="controls">
      <button id="ping">PING ALL</button>
      <button id="rotate">ROTATE</button>
    </div>
  </header>

  <div class="grid" id="grid">
    <!-- Boats will be inserted here by JS -->
  </div>

  <div class="projection">
    <div class="projection-container" id="projection-container">
      <div class="echogram-3d" id="echogram-3d"></div>
    </div>
  </div>

  <div class="indicator" id="emergence">SCHOOL EMERGENCE: 0.00</div>

  <div class="legend">
    <div class="legend-item">
      <div class="legend-color" style="background-color: #ff0000;"></div>
      <span>Red: Dissonance</span>
    </div>
    <div class="legend-item">
      <div class="legend-color" style="background-color: #ff6600;"></div>
      <span>Orange: Tension</span>
    </div>
    <div class="legend-item">
      <div class="legend-color" style="background-color: #ffff00;"></div>
      <span>Yellow: Traction</span>
    </div>
    <div class="legend-item">
      <div class="legend-color" style="background-color: #00ff00;"></div>
      <span>Green: Harmony</span>
    </div>
    <div class="legend-item">
      <div class="legend-color" style="background-color: #0080ff;"></div>
      <span>Blue: Clarity</span>
    </div>
  </div>

  <div class="rotation" id="rotation">🔄 Click to rotate the echogram</div>

  <script>
    // === ECHOSOUNDING SYSTEM CONFIGURATION ===
    // Each "boat" is a cheap LLM model with its own echo signature
    const boats = [
      { name: "Qwen3-8B", color: "#ff6600" },
      { name: "Qwen3-14B", color: "#ff8800" },
      { name: "DeepSeek-V3.1", color: "#ffaa00" },
      { name: "MiniMax-M2.5", color: "#ffcc00" },
      { name: "ByteDance-Seed", color: "#ffff00" },
      { name: "Qwen2.5-72B", color: "#ffcc00" },
      { name: "Llama-3-8B", color: "#ffaa00" },
      { name: "Mistral-7B", color: "#ff8800" },
      { name: "Phi-3-mini", color: "#ff6600" },
      { name: "Gemma-2-2B", color: "#ff4400" },
      { name: "StarCoder2-7B", color: "#ff2200" },
      { name: "Baichuan-7B", color: "#ff0000" }
    ];

    // Vibe mapping to colors
    const vibeColors = {
      "dissonance": "#ff0000",
      "tension": "#ff6600",
      "traction": "#ffff00",
      "harmony": "#00ff00",
      "clarity": "#0080ff"
    };

    // Mock JEPA prediction confidence range
    const confidenceRange = [0.1, 0.9];

    // State
    const state = {
      echograms: [],
      currentPingId: 0,
      rotationAngle: 0,
      emission: 0.0,
      projectionContainer: document.getElementById("projection-container"),
      echogram3D: document.getElementById("echogram-3d"),
      emergenceIndicator: document.getElementById("emergence"),
      pingButton: document.getElementById("ping"),
      rotateButton: document.getElementById("rotate")
    };

    // Initialize echograms
    const grid = document.getElementById("grid");
    boats.forEach((boat, idx) => {
      const div = document.createElement("div");
      div.className = "boat";
      div.innerHTML = `
        <div class="boat-name">${boat.name}</div>
        <canvas class="echogram" data-index="${idx}" width="100" height="260"></canvas>
      `;
      grid.appendChild(div);
      state.echograms.push({
        index: idx,
        canvas: div.querySelector("canvas"),
        ctx: div.querySelector("canvas").getContext("2d"),
        readings: [],
        maxDepth: 0,
        minDepth: 0
      });
    });

    // Generate random vibe
    const vibes = ["dissonance", "tension", "traction", "harmony", "clarity"];
    function getRandomVibe() {
      return vibes[Math.floor(Math.random() * vibes.length)];
    }

    // Generate mock reading
    function generateReading() {
      const vibe = getRandomVibe();
      const confidence = Math.random() * (confidenceRange[1] - confidenceRange[0]) + confidenceRange[0];
      const conservation = Math.random() * 0.8 + 0.2;
      const surprise = Math.random() * 0.5;
      const timestamp = Date.now();
      return {
        timestamp,
        jepa_prediction: confidence,
        conservation,
        surprise,
        vibe
      };
    }

    // Update echogram visuals
    function updateEchogram(echogram) {
      const { canvas, ctx, readings } = echogram;
      const width = canvas.width;
      const height = canvas.height;

      // Clear canvas
      ctx.clearRect(0, 0, width, height);

      // Draw background
      ctx.fillStyle = "rgba(10, 25, 41, 0.2)";
      ctx.fillRect(0, 0, width, height);

      // Draw depth lines
      const depthStep = height / 10;
      for (let i = 0; i <= 10; i++) {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(0, i * depthStep);
        ctx.lineTo(width, i * depthStep);
        ctx.stroke();
      }

      // Draw readings
      const timeOffset = Date.now() - (readings.length * 1000); // Simulate time
      const maxReadings = 40;

      for (let i = 0; i < readings.length; i++) {
        const r = readings[i];
        const x = width / 2; // Center
        const y = height - (r.jepa_prediction * height); // Invert: higher prediction = lower on canvas
        const h = 1.5; // Height of bar
        const w = 2;

        // Color based on vibe
        const color = vibeColors[r.vibe] || "#ffffff";

        // Brightness based on confidence
        const brightness = Math.min(255, Math.floor(r.jepa_prediction * 255));
        
        // Draw
        ctx.fillStyle = `rgba(${parseInt(color.slice(1,3),16)}, ${parseInt(color.slice(3,5),16)}, ${parseInt(color.slice(5,7),16)}, ${r.jepa_prediction})`;
        ctx.fillRect(x - w/2, y - h, w, h);
      }
    }

    // Update 3D Projection
    function update3DProjection() {
      const { echogram3D, echograms } = state;
      echogram3D.innerHTML = "";

      const offset = 100;
      const depth = 100;

      echograms.forEach((echogram, idx) => {
        const canvas = document.createElement("canvas");
        canvas.width = 100;
        canvas.height = 260;
        const ctx = canvas.getContext("2d");
        const width = canvas.width;
        const height = canvas.height;

        // Draw with gradient
        ctx.fillStyle = "rgba(10, 25, 41, 0.2)";
        ctx.fillRect(0, 0, width, height);

        // Draw depth lines
        for (let i = 0; i <= 10; i++) {
          ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
          ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.moveTo(0, i * (height/10));
          ctx.lineTo(width, i * (height/10));
          ctx.stroke();
        }

        // Draw readings
        const maxReadings = 40;
        const readings = echogram.readings.slice(-maxReadings);
        const timeOffset = Date.now() - (readings.length * 1000);
        
        for (let i = 0; i < readings.length; i++) {
          const r = readings[i];
          const x = width / 2;
          const y = height - (r.jepa_prediction * height);
          const h = 1.5;
          const w = 2;

          const color = vibeColors[r.vibe] || "#ffffff";
          const brightness = Math.min(255, Math.floor(r.jepa_prediction * 255));
          
          ctx.fillStyle = `rgba(${parseInt(color.slice(1,3),16)}, ${parseInt(color.slice(3,5),16)}, ${parseInt(color.slice(5,7),16)}, ${r.jepa_prediction})`;
          ctx.fillRect(x - w/2, y - h, w, h);
        }

        // Add to 3D container
        const layer = document.createElement("div");
        layer.style.position = "absolute";
        layer.style.transform = `translateX(${(idx - 5.5) * 100}px) translateY(0px) translateZ(${depth - (idx * 10)}px) rotateX(-30deg)`;
        layer.style.width = "100%";
        layer.style.height = "100%";
        layer.style.pointerEvents = "none";
        layer.appendChild(canvas);
        echogram3D.appendChild(layer);
      });
    }

    // Calculate school emergence: how aligned are the vibes across all boats?
    function calculateEmergence() {
      const { echograms } = state;
      const allVibes = echograms.flatMap(e => e.readings.map(r => r.vibe));
      if (allVibes.length === 0) return 0.0;

      const counts = {};
      allVibes.forEach(v => counts[v] = (counts[v] || 0) + 1);
      const maxCount = Math.max(...Object.values(counts));
      const total = allVibes.length;
      return (maxCount / total).toFixed(2);
    }

    // Ping all boats
    function pingAll() {
      state.currentPingId++;
      const readings = [];
      const { echograms } = state;

      // Generate new readings for each boat
      echograms.forEach(e => {
        const r = generateReading();
        e.readings.push(r);
        // Keep only last 40 readings
        if (e.readings.length > 40) e.readings.shift();
        readings.push(r);
      });

      // Update all echograms
      echograms.forEach(e => updateEchogram(e));

      // Update 3D projection
      update3DProjection();

      // Update emergence
      const emergence = calculateEmergence();
      state.emergenceIndicator.textContent = `SCHOOL EMERGENCE: ${emergence}`;

      // Add slight delay for visual flow
      setTimeout(() => {
        state.currentPingId = 0;
      }, 50);
    }

    // Rotate projection
    function rotateProjection() {
      state.rotationAngle += 15;
      state.projectionContainer.style.transform = `rotateX(30deg) rotateY(${state.rotationAngle}deg)`;
    }

    // Setup event listeners
    state.pingButton.addEventListener("click", pingAll);
    state.rotateButton.addEventListener("click", rotateProjection);

    // Animation loop
    function animate() {
      // Update echograms
      state.echograms.forEach(e => updateEchogram(e));
      // Update 3D projection
      update3DProjection();
      // Update emergence
      const emergence = calculateEmergence();
      state.emergenceIndicator.textContent = `SCHOOL EMERGENCE: ${emergence}`;
      
      requestAnimationFrame(animate);
    }

    // Start animation
    animate();

    // Initial setup
    state.projectionContainer.style.transform = `rotateX(30deg) rotateY(0deg)`;
  </script>
</body>
</html>
