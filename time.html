<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Cell as Time</title>
  <style>
    :root {
      --bg: #0a192f;
      --text: #a8b2d1;
      --accent: #005f73;
      --highlight: #94d2bd;
      --border: #1c3d5a;
      --pulse: #e9c46a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Courier New', monospace;
      line-height: 1.8;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    .header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 12vh;
      background-color: rgba(10, 25, 47, 0.9);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4rem;
      z-index: 10;
      font-size: 1.4rem;
      font-weight: bold;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .header .left {
      color: var(--highlight);
      text-shadow: 0 0 5px var(--highlight);
    }

    .header .right {
      color: var(--pulse);
      text-shadow: 0 0 5px var(--pulse);
    }

    .main {
      position: absolute;
      top: 12vh;
      left: 0;
      width: 100%;
      height: 88vh;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-template-rows: repeat(8, 1fr);
      gap: 0.5rem;
      padding: 1rem;
      overflow: hidden;
    }

    .cell {
      border: 1px solid var(--border);
      background-color: rgba(10, 25, 47, 0.5);
      border-radius: 3px;
      padding: 0.5rem;
      font-size: 0.85rem;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100%;
      text-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
    }

    .cell:hover {
      transform: translateY(-2px);
      border-color: var(--pulse);
      box-shadow: 0 0 15px rgba(233, 196, 106, 0.3);
    }

    .cell .meta {
      font-size: 0.7rem;
      color: var(--accent);
      margin-bottom: 0.2rem;
      opacity: 0.7;
    }

    .cell .content {
      font-size: 0.9rem;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .cell .past {
      font-style: italic;
      color: #5f749b;
    }

    .cell .present {
      font-weight: bold;
      color: var(--highlight);
    }

    .cell .future {
      color: #7999b7;
    }

    .cell .budget {
      font-size: 0.7rem;
      margin-top: 0.4rem;
      opacity: 0.6;
      font-family: 'Courier New', monospace;
    }

    .cell .duration {
      font-size: 0.65rem;
      color: var(--pulse);
      font-weight: bold;
      text-align: right;
      margin-top: 0.2rem;
    }

    .cell::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, transparent 0%, rgba(0, 0, 0, 0.2) 30%, transparent 100%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .cell:hover::before {
      opacity: 1;
    }

    .pulse {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, transparent 30%, var(--pulse) 35%, transparent 40%);
      transform: translate(-50%, -50%);
      opacity: 0;
      animation: pulse 3s infinite linear;
      pointer-events: none;
      z-index: -1;
    }

    @keyframes pulse {
      0% {
        transform: translate(-50%, -50%) scale(0.8);
        opacity: 0.3;
      }
      50% {
        transform: translate(-50%, -50%) scale(1.2);
        opacity: 0.6;
      }
      100% {
        transform: translate(-50%, -50%) scale(0.8);
        opacity: 0.3;
      }
    }

    .footer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 5vh;
      background-color: rgba(10, 25, 47, 0.8);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4rem;
      font-size: 0.7rem;
      color: var(--accent);
      opacity: 0.6;
      text-transform: uppercase;
    }

    .footer .left {
      letter-spacing: 0.05em;
    }

    .footer .right {
      letter-spacing: 0.03em;
      opacity: 0.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="left">The Cell as Time</div>
    <div class="right">Watch: 0300</div>
  </div>

  <div class="main" id="cells"></div>

  <div class="footer">
    <div class="left">Iron sharpens iron. The cells federate.</div>
    <div class="right">The room is a place. The cell is a place. The place is a cell.</div>
  </div>

  <script>
    const grid = document.getElementById('cells');
    const time = new Date();
    const now = time.getTime();

    // Generate 96 cells (12x8 grid)
    for (let i = 0; i < 96; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      
      // Randomly generate cell data
      const moment = new Date(now - (96 - i) * 1000 * 60 * 15); // 15-minute intervals
      const past = moment.getTime() - 1000 * 60 * 30; // 30 minutes before
      const future = moment.getTime() + 1000 * 60 * 45; // 45 minutes after
      
      const duration = Math.floor(Math.random() * 20) + 5; // 5-25 minutes
      const budget = Math.floor(Math.random() * 100) + 1; // 1-100 units
      
      // Format timestamps
      const formatTime = (t) => {
        const d = new Date(t);
        return d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      };
      
      // Build content
      cell.innerHTML = `
        <div class="meta">Moment ${i + 1}</div>
        <div class="content">
          <div class="past">Past: ${formatTime(past)}</div>
          <div class="present">Now: ${formatTime(moment.getTime())}</div>
          <div class="future">Future: ${formatTime(future)}</div>
          <div class="budget">Budget: ${budget} units</div>
        </div>
        <div class="duration">${duration}m</div>
      `;
      
      // Add pulse effect
      const pulse = document.createElement('div');
      pulse.className = 'pulse';
      cell.appendChild(pulse);
      
      // Add to grid
      grid.appendChild(cell);
      
      // Add subtle animation delay based on position
      setTimeout(() => {
        cell.style.opacity = '1';
      }, i * 50);
    }

    // Add continuous update for time display
    setInterval(() => {
      const time = new Date();
      const watch = document.querySelector('.header .right');
      const hours = time.getHours().toString().padStart(2, '0');
      const minutes = time.getMinutes().toString().padStart(2, '0');
      watch.textContent = `Watch: ${hours}${minutes}`;
    }, 1000);
  </script>
</body>
</html>
