<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Echo Recorder</title>
  <style>
    :root {
      --bg: #0a0d16;
      --text: #c9d1d9;
      --accent: #1c8dff;
      --fish: #54b3ff;
      --grid: #1a2130;
      --record: #ff4e4e;
      --record-active: #ff7e7e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      text-align: center;
      position: relative;
    }

    h1 {
      font-size: 3.5rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, var(--accent), var(--fish));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 1.2rem;
      color: #99a2b3;
      margin-bottom: 2rem;
      font-weight: 400;
    }

    .controls {
      margin-bottom: 2rem;
    }

    .record-btn {
      background-color: var(--record);
      color: white;
      border: none;
      padding: 1rem 2.5rem;
      font-size: 1.2rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255, 78, 78, 0.4);
      outline: none;
    }

    .record-btn:hover {
      background-color: var(--record-active);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 78, 78, 0.6);
    }

    .record-btn:active {
      transform: translateY(1px);
    }

    .record-btn.recording {
      background-color: var(--record-active);
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 78, 78, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(255, 78, 78, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 78, 78, 0); }
    }

    .waveform {
      height: 100px;
      width: 100%;
      background-color: rgba(26, 33, 48, 0.5);
      border-radius: 8px;
      margin-bottom: 1.5rem;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--grid);
    }

    .waveform canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .echogram {
      width: 100%;
      height: 500px;
      background-color: rgba(10, 13, 22, 0.9);
      border-radius: 8px;
      position: relative;
      border: 1px solid var(--grid);
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .echogram canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background-image: 
        linear-gradient(rgba(26, 33, 48, 0.5) 1px, transparent 1px),
        linear-gradient(90deg, rgba(26, 33, 48, 0.5) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .fish {
      position: absolute;
      width: 3px;
      height: 6px;
      background-color: var(--fish);
      border-radius: 50%;
      opacity: 0.8;
      transform-origin: bottom center;
      z-index: 1;
    }

    .fish a {
      position: absolute;
      width: 10px;
      height: 10px;
      background-color: var(--fish);
      border-radius: 50%;
      opacity: 0.2;
      z-index: -1;
    }

    .fish b {
      position: absolute;
      width: 10px;
      height: 10px;
      background-color: var(--fish);
      border-radius: 50%;
      opacity: 0.1;
      z-index: -1;
    }

    .fish.active {
      opacity: 1;
    }

    .fish-1 {
      background-color: #54b3ff;
      animation: swim 4s infinite linear;
    }

    .fish-2 {
      background-color: #73c4ff;
      animation: swim 4.5s infinite linear;
    }

    .fish-3 {
      background-color: #92d5ff;
      animation: swim 5s infinite linear;
    }

    .fish-4 {
      background-color: #b1e6ff;
      animation: swim 5.5s infinite linear;
    }

    .fish-5 {
      background-color: #d0f7ff;
      animation: swim 6s infinite linear;
    }

    @keyframes swim {
      0% {
        transform: translateY(0) rotate(0deg);
      }
      100% {
        transform: translateY(-100vh) rotate(360deg);
      }
    }

    .fish-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .status {
      font-size: 0.9rem;
      color: #99a2b3;
      margin-top: 1rem;
      opacity: 0.7;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2.5rem;
      }
      .subtitle {
        font-size: 1rem;
      }
      .record-btn {
        padding: 0.8rem 2rem;
      }
      .echogram {
        height: 350px;
      }
      .fish {
        width: 2px;
        height: 4px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Echo Recorder</h1>
    <p class="subtitle">your voice as a school of fish</p>
    
    <div class="controls">
      <button id="recordBtn" class="record-btn">Record</button>
    </div>
    
    <div class="waveform">
      <canvas id="waveCanvas"></canvas>
    </div>
    
    <div class="echogram">
      <div class="grid"></div>
      <div class="fish-container" id="fishContainer"></div>
      <canvas id="echogramCanvas"></canvas>
    </div>
    
    <p class="status" id="status">Click record to begin</p>
  </div>

  <script>
    // Initialize audio context
    let audioContext;
    let analyser;
    let microphone;
    let isRecording = false;
    let dataArray;
    let canvasCtx;
    let waveCanvas;
    let echogramCanvas;
    let fishContainer;
    let fishArray = [];
    const NUM_COLUMNS = 100;
    const COL_WIDTH = 4;
    const MAX_HEIGHT = 480;
    const MIN_HEIGHT = 5;
    const UPDATE_INTERVAL = 16; // ~60fps
    const FREQUENCY_BINS = 128;

    // Setup audio and canvases
    window.addEventListener('load', () => {
      waveCanvas = document.getElementById('waveCanvas');
      echogramCanvas = document.getElementById('echogramCanvas');
      fishContainer = document.getElementById('fishContainer');
      const statusEl = document.getElementById('status');
      const recordBtn = document.getElementById('recordBtn');

      // Initialize canvas sizes
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      // Setup audio
      setupAudio();

      // Record button
      recordBtn.addEventListener('click', toggleRecording);

      // Create fish elements
      createFish();
    });

    function resizeCanvas() {
      const waveRect = waveCanvas.getBoundingClientRect();
      const echoRect = echogramCanvas.getBoundingClientRect();

      waveCanvas.width = waveRect.width;
      waveCanvas.height = waveRect.height;
      echogramCanvas.width = echoRect.width;
      echogramCanvas.height = echoRect.height;

      canvasCtx = echogramCanvas.getContext('2d');
      canvasCtx.fillStyle = '#0a0d16';
      canvasCtx.fillRect(0, 0, echogramCanvas.width, echogramCanvas.height);

      // Draw grid
      drawGrid();
    }

    function setupAudio() {
      navigator.mediaDevices.getUserMedia({ audio: true })
        .then(stream => {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          microphone = audioContext.createMediaStreamSource(stream);
          analyser = audioContext.createAnalyser();
          analyser.fftSize = 256;
          analyser.smoothingTimeConstant = 0.8;

          microphone.connect(analyser);

          // Get data array for frequency analysis
          dataArray = new Uint8Array(analyser.frequencyBinCount);

          // Start visualization
          requestAnimationFrame(visualize);
        })
        .catch(err => {
          console.error('Error accessing microphone:', err);
          document.getElementById('status').textContent = 'Microphone access denied';
        });
    }

    function toggleRecording() {
      const recordBtn = document.getElementById('recordBtn');
      const statusEl = document.getElementById('status');

      if (isRecording) {
        // Stop recording
        isRecording = false;
        recordBtn.classList.remove('recording');
        recordBtn.textContent = 'Record';
        statusEl.textContent = 'Recording stopped';
      } else {
        // Start recording
        isRecording = true;
        recordBtn.classList.add('recording');
        recordBtn.textContent = 'Stop';
        statusEl.textContent = 'Listening... Speak into the mic';
      }
    }

    function visualize() {
      if (!isRecording) {
        requestAnimationFrame(visualize);
        return;
      }

      analyser.getByteTimeDomainData(dataArray);

      // Draw waveform
      const waveCtx = waveCanvas.getContext('2d');
      waveCtx.clearRect(0, 0, waveCanvas.width, waveCanvas.height);
      waveCtx.lineWidth = 2;
      waveCtx.strokeStyle = '#1c8dff';
      waveCtx.beginPath();
      const sliceWidth = waveCanvas.width * 1.0 / dataArray.length;
      let x = 0;

      for (let i = 0; i < dataArray.length; i++) {
        const v = dataArray[i] / 128.0;
        const y = v * waveCanvas.height / 2;

        if (i === 0) {
          waveCtx.moveTo(x, y);
        } else {
          waveCtx.lineTo(x, y);
        }
        x += sliceWidth;
      }

      waveCtx.lineTo(waveCanvas.width, waveCanvas.height / 2);
      waveCtx.stroke();

      // Draw echogram
      canvasCtx.fillStyle = '#0a0d16';
      canvasCtx.fillRect(0, 0, echogramCanvas.width, echogramCanvas.height);

      // Get frequency data
      analyser.getByteFrequencyData(dataArray);

      // Normalize data for visualization
      const binWidth = Math.floor(dataArray.length / NUM_COLUMNS);
      
      // Draw each column
      for (let i = 0; i < NUM_COLUMNS; i++) {
        const startBin = i * binWidth;
        const endBin = startBin + binWidth;
        let sum = 0;
        
        for (let j = startBin; j < endBin && j < dataArray.length; j++) {
          sum += dataArray[j];
        }
        
        const avg = sum / binWidth;
        const height = Math.max(MIN_HEIGHT, (avg / 255.0) * MAX_HEIGHT);
        
        // Draw column
        const colX = i * (echogramCanvas.width / NUM_COLUMNS);
        const colY = echogramCanvas.height - height;
        
        canvasCtx.fillStyle = `hsl(${(i % 120) + 180}, 70%, ${Math.min(80, avg / 2)}%)`;
        canvasCtx.fillRect(colX, colY, COL_WIDTH, height);
      }

      // Update fish
      updateFish();

      requestAnimationFrame(visualize);
    }

    function createFish() {
      for (let i = 0; i < 200; i++) {
        const fish = document.createElement('div');
        fish.className = `fish fish-${Math.floor(Math.random() * 5) + 1}`;
        fish.style.left = `${Math.random() * 100}%`;
        fish.style.bottom = '0px';
        fish.style.height = `${Math.random() * 10 + 4}px`;
        fish.style.width = `${Math.random() * 2 + 1}px`;
        fish.style.opacity = Math.random() * 0.5 + 0.3;
        
        const tail = document.createElement('a');
        tail.style.left = '0';
        tail.style.bottom = '-2px';
        tail.style.width = '4px';
        tail.style.height = '4px';
        tail.style.borderRadius = '50%';
        
        const fin = document.createElement('b');
        fin.style.left = '0';
        fin.style.bottom = '-2px';
        fin.style.width = '4px';
        fin.style.height = '4px';
        fin.style.borderRadius = '50%';
        
        fish.appendChild(tail);
        fish.appendChild(fin);
        
        fishContainer.appendChild(fish);
        fishArray.push({
          element: fish,
          x: parseFloat(fish.style.left),
          y: parseFloat(fish.style.bottom),
          speed: Math.random() * 2 + 1,
          direction: Math.random() > 0.5 ? 1 : -1,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    function updateFish() {
      if (!isRecording) return;
      
      // Get average intensity from frequency data
      analyser.getByteFrequencyData(dataArray);
      const avg = dataArray.reduce((a, b) => a + b, 0) / dataArray.length;
      
      // Determine fish activity based on audio intensity
      const activity = Math.min(1, avg / 128);
      
      // Update fish based on audio
      fishArray.forEach(fish => {
        // Move fish
        fish.x += fish.speed * fish.direction * (activity * 2);
        
        // Change direction randomly
        if (Math.random() < 0.01 * activity) {
          fish.direction *= -1;
        }
        
        // Add some randomness
        fish.y += (Math.random() - 0.5) * 1.5 * activity;
        
        // Keep within bounds
        if (fish.x < 0 || fish.x > 100) {
          fish.direction *= -1;
        }
        
        // Apply movement
        fish.element.style.left = `${fish.x}%`;
        fish.element.style.bottom = `${fish.y}px`;
        
        // Fade in/out based on proximity to high frequencies
        const highFreqAvg = dataArray.slice(128, 192).reduce((a, b) => a + b, 0) / 64;
        const opacity = Math.max(0.1, 0.3 + (highFreqAvg / 255) * 0.7);
        fish.element.style.opacity = opacity;
        
        // Spawn new fish occasionally when voice is detected
        if (Math.random() < 0.05 * activity && fishArray.length < 400) {
          const newFish = document.createElement('div');
          newFish.className = `fish fish-${Math.floor(Math.random() * 5) + 1}`;
          newFish.style.left = `${Math.random() * 100}%`;
          newFish.style.bottom = '0px';
          newFish.style.height = `${Math.random() * 10 + 4}px`;
          newFish.style.width = `${Math.random() * 2 + 1}px`;
          newFish.style.opacity = Math.random() * 0.5 + 0.3;
          
          const tail = document.createElement('a');
          tail.style.left = '0';
          tail.style.bottom = '-2px';
          tail.style.width = '4px';
          tail.style.height = '4px';
          tail.style.borderRadius = '50%';
          
          const fin = document.createElement('b');
          fin.style.left = '0';
          fin.style.bottom = '-2px';
          fin.style.width = '4px';
          fin.style.height = '4px';
          fin.style.borderRadius = '50%';
          
          newFish.appendChild(tail);
          newFish.appendChild(fin);
          
          fishContainer.appendChild(newFish);
          
          fishArray.push({
            element: newFish,
            x: parseFloat(newFish.style.left),
            y: parseFloat(newFish.style.bottom),
            speed: Math.random() * 2 + 1,
            direction: Math.random() > 0.5 ? 1 : -1,
            phase: Math.random() * Math.PI * 2
          });
        }
      });
    }

    function drawGrid() {
      const ctx = echogramCanvas.getContext('2d');
      ctx.strokeStyle = '#1a2130';
      ctx.lineWidth = 0.5;
      
      // Vertical lines
      for (let x = 0; x <= echogramCanvas.width; x += 20) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, echogramCanvas.height);
        ctx.stroke();
      }
      
      // Horizontal lines
      for (let y = 0; y <= echogramCanvas.height; y += 20) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(echogramCanvas.width, y);
        ctx.stroke();
      }
    }
  </script>
</body>
</html>
