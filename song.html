<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Cell as Song</title>
  <style>
    :root {
      --bg: #0a0f18;
      --text: #c3d9f2;
      --accent: #0088cc;
      --glow: #00aaff;
      --grid: #121c2d;
      --pulse: #005588;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: 'Courier New', monospace;
      background-color: var(--bg);
      color: var(--text);
      overflow: hidden;
      line-height: 1.6;
      letter-spacing: 0.04em;
    }

    #container {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      overflow: hidden;
    }

    header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 8rem;
      background: linear-gradient(to bottom, rgba(10, 15, 24, 0.95), transparent);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      text-align: center;
      border-bottom: 1px solid var(--grid);
      box-shadow: 0 0 15px rgba(0, 136, 204, 0.2);
    }

    header h1 {
      font-size: 3.2rem;
      font-weight: 700;
      letter-spacing: 0.1rem;
      color: var(--accent);
      text-shadow: 0 0 10px var(--glow);
      background: linear-gradient(90deg, var(--accent), var(--glow), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: pulse 3.5s ease-in-out infinite alternate;
    }

    .subtitle {
      font-size: 1.1rem;
      color: var(--text);
      margin-top: 0.5rem;
      opacity: 0.7;
      font-weight: 300;
    }

    #grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(18, 28, 45, 0.3) 1px, transparent 1px),
        linear-gradient(90deg, rgba(18, 28, 45, 0.3) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 1;
    }

    .cell {
      position: absolute;
      width: 16px;
      height: 16px;
      background: var(--accent);
      border-radius: 50%;
      filter: drop-shadow(0 0 4px var(--glow));
      transition: all 0.3s ease;
      opacity: 0.5;
      z-index: 2;
    }

    .cell.active {
      opacity: 1;
      transform: scale(1.6);
      box-shadow: 0 0 15px var(--glow), 0 0 30px var(--pulse);
    }

    .cell::before {
      content: '';
      position: absolute;
      top: -1px;
      left: -1px;
      width: 100%;
      height: 100%;
      background: inherit;
      border-radius: 50%;
      filter: blur(2px);
      opacity: 0.8;
      transform: scale(1.2);
    }

    .cell.highlight {
      background: var(--glow);
      box-shadow: 0 0 20px var(--glow), 0 0 40px var(--pulse);
    }

    .info {
      position: absolute;
      bottom: 2rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.9rem;
      color: var(--text);
      opacity: 0.6;
      letter-spacing: 0.03em;
      z-index: 10;
    }

    .info span {
      display: inline-block;
      margin: 0 0.8rem;
      padding: 0.2rem 0.6rem;
      background: rgba(18, 28, 45, 0.5);
      border: 1px solid var(--grid);
      border-radius: 3px;
    }

    @keyframes pulse {
      0% {
        text-shadow: 0 0 10px var(--glow), 0 0 20px var(--glow);
      }
      100% {
        text-shadow: 0 0 15px var(--glow), 0 0 30px var(--glow), 0 0 45px var(--pulse);
      }
    }

    @keyframes breath {
      0%, 100% {
        opacity: 0.3;
      }
      50% {
        opacity: 0.8;
      }
    }

    .cell.breathe {
      animation: breath 3s ease-in-out infinite;
    }

    .cell.fade {
      opacity: 0.1;
      transition: opacity 1.2s ease-out;
    }
  </style>
</head>
<body>
  <div id="container">
    <header>
      <h1>THE CELL AS SONG</h1>
      <div class="subtitle">Each cell is a note. Each cell has a pitch, a duration, a timbre. Together they form a chord.</div>
    </header>

    <div id="grid"></div>

    <div class="info">
      <span>CELLS: <span id="count">0</span></span>
      <span>ACTIVE: <span id="active">0</span></span>
      <span>CHORD: <span id="chord">0</span></span>
    </div>
  </div>

  <script>
    // Maritime Watch - The Cell as Song
    // Iron sharpens iron. The cells federate. The room is a place. The cell is a place. The place is a cell. The room IS the cell.

    const container = document.getElementById('container');
    const grid = document.getElementById('grid');
    const countEl = document.getElementById('count');
    const activeEl = document.getElementById('active');
    const chordEl = document.getElementById('chord');

    let cells = [];
    let activeCells = new Set();
    let chordCount = 0;
    let lastTime = 0;
    let frameId = null;

    // Maritime constants
    const MAX_CELLS = 150;
    const CELL_RADIUS = 8;
    const GRID_SIZE = 40;
    const GRID_WIDTH = window.innerWidth;
    const GRID_HEIGHT = window.innerHeight;

    // Generate a unique cell
    function createCell() {
      const x = Math.random() * GRID_WIDTH;
      const y = Math.random() * GRID_HEIGHT;
      const pitch = Math.random() * 2.0 + 0.5; // 0.5 - 2.5
      const duration = Math.random() * 2000 + 500; // 500 - 2500ms
      const timbre = Math.random() * 0.8 + 0.2; // 0.2 - 1.0
      const id = Date.now() + Math.random();

      const cell = {
        id,
        x,
        y,
        pitch,
        duration,
        timbre,
        element: null,
        active: false,
        startTime: 0
      };

      const element = document.createElement('div');
      element.classList.add('cell');
      element.style.left = `${x - CELL_RADIUS}px`;
      element.style.top = `${y - CELL_RADIUS}px`;
      element.style.backgroundColor = `hsl(${(pitch * 180) % 360}, 80%, 60%)`;
      element.style.opacity = '0.5';
      element.setAttribute('data-id', id);

      container.appendChild(element);
      cell.element = element;

      return cell;
    }

    // Initialize cells
    function initCells() {
      for (let i = 0; i < MAX_CELLS; i++) {
        cells.push(createCell());
      }
      countEl.textContent = cells.length;
    }

    // Activate a random cell
    function activateCell() {
      if (cells.length === 0) return;

      const idx = Math.floor(Math.random() * cells.length);
      const cell = cells[idx];

      if (cell.active) return;

      cell.active = true;
      cell.startTime = performance.now();
      activeCells.add(cell.id);

      cell.element.classList.add('active');
      cell.element.classList.add('breathe');

      chordCount++;
      chordEl.textContent = chordCount;

      // Optional: Add subtle audio feedback (simulate with timing only)
      setTimeout(() => {
        if (cell.active) {
          deactivateCell(cell);
        }
      }, cell.duration);
    }

    // Deactivate a cell
    function deactivateCell(cell) {
      if (!cell.active) return;

      cell.active = false;
      activeCells.delete(cell.id);
      cell.element.classList.remove('active');
      cell.element.classList.remove('breathe');

      // Fade out opacity
      setTimeout(() => {
        if (cell.element && cell.element.parentNode) {
          cell.element.style.opacity = '0.1';
        }
      }, 100);

      setTimeout(() => {
        if (cell.element && cell.element.parentNode) {
          cell.element.remove();
        }
      }, 1200);

      // Replenish
      cells = cells.filter(c => c.id !== cell.id);
      cells.push(createCell());

      countEl.textContent = cells.length;
      activeEl.textContent = activeCells.size;
      chordCount = Math.max(0, chordCount - 1);
      chordEl.textContent = chordCount;
    }

    // Watch the silence, watch the pulse
    function animate(time) {
      if (time - lastTime > 1000 / 30) { // ~30fps
        // Random activation
        if (Math.random() < 0.02 && activeCells.size < 10) {
          activateCell();
        }

        // Update active cells
        for (const cell of cells) {
          if (cell.active) {
            const elapsed = time - cell.startTime;
            const progress = elapsed / cell.duration;

            // Pulse the cell
            const pulse = Math.sin(progress * Math.PI * 2) * 0.5 + 0.5;
            cell.element.style.opacity = (0.3 + pulse * 0.7).toFixed(2);
          }
        }

        lastTime = time;
      }

      frameId = requestAnimationFrame(animate);
    }

    // Handle window resize
    window.addEventListener('resize', () => {
      const newWidth = window.innerWidth;
      const newHeight = window.innerHeight;
      
      // Re-position cells
      for (const cell of cells) {
        cell.x = Math.min(cell.x, newWidth - 20);
        cell.y = Math.min(cell.y, newHeight - 20);
        cell.element.style.left = `${cell.x - CELL_RADIUS}px`;
        cell.element.style.top = `${cell.y - CELL_RADIUS}px`;
      }
    });

    // Start the watch
    window.addEventListener('load', () => {
      initCells();
      animate(0);
      
      // Add subtle ambient pulse
      setInterval(() => {
        const pulse = Math.random() < 0.15 ? 'highlight' : '';
        const cellsList = document.querySelectorAll('.cell');
        if (cellsList.length > 0) {
          const randomCell = cellsList[Math.floor(Math.random() * cellsList.length)];
          randomCell.classList.remove('highlight');
          if (pulse) {
            randomCell.classList.add('highlight');
            setTimeout(() => {
              if (randomCell.parentNode) {
                randomCell.classList.remove('highlight');
              }
            }, 300);
          }
        }
      }, 2000);
    });

    // Clean up on unload
    window.addEventListener('beforeunload', () => {
      if (frameId) {
        cancelAnimationFrame(frameId);
      }
    });

    // Watchful silence
    document.addEventListener('click', (e) => {
      const rect = container.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      // Activate nearby cells
      const nearby = cells.filter(c => {
        const dx = c.x - x;
        const dy = c.y - y;
        return Math.sqrt(dx*dx + dy*dy) < 150;
      });
      
      nearby.forEach(cell => {
        if (!cell.active) {
          activateCell();
        }
      });
    });
  </script>
</body>
</html>
