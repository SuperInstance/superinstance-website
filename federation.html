<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Federation</title>
  <style>
    :root {
      --bg: #0a0a10;
      --text: #c8d0e0;
      --accent: #5a9fd7;
      --border: #2a3650;
      --card-bg: #121722;
      --signal: #e0a040;
      --decompose: #a0d0a0;
      --pilot: #d08080;
      --watch: #80a0c0;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', monospace;
      line-height: 1.6;
      overflow-x: hidden;
    }

    .header {
      background: var(--border);
      border-bottom: 1px solid var(--accent);
      padding: 1.5rem 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .header h1 {
      font-size: 2.8rem;
      margin: 0;
      color: var(--accent);
      letter-spacing: -1px;
      text-shadow: 0 0 8px rgba(90, 159, 215, 0.3);
      font-weight: 700;
    }

    .header .subtitle {
      font-size: 1.2rem;
      margin-top: 0.5rem;
      color: var(--text);
      opacity: 0.8;
      font-weight: 500;
    }

    .container {
      max-width: 1400px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 1.5rem;
    }

    .agent-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.2rem;
      margin-bottom: 1.5rem;
    }

    .agent-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1.2rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .agent-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
    }

    .agent-name {
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.5rem;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .agent-mode {
      font-size: 0.9rem;
      color: #a0c0f0;
      margin-bottom: 0.8rem;
      font-style: italic;
      opacity: 0.8;
    }

    .ratios {
      margin-bottom: 0.8rem;
    }

    .ratios label {
      display: inline-block;
      width: 45px;
      font-size: 0.85rem;
      color: var(--text);
      opacity: 0.7;
      text-align: right;
      margin-right: 4px;
    }

    .ratios span {
      font-family: 'Courier New', monospace;
      font-weight: 600;
      color: var(--signal);
      font-size: 0.9rem;
    }

    .signal {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--signal);
      margin-top: 0.3rem;
      text-align: right;
    }

    .federation-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1.5rem;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
      margin-bottom: 1.5rem;
    }

    .federation-panel h2 {
      margin: 0 0 1rem 0;
      font-size: 1.3rem;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }

    .federation-signal {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--signal);
      text-align: center;
      letter-spacing: 1px;
      margin: 0.5rem 0;
    }

    .decompose-btn {
      display: block;
      width: 100%;
      padding: 0.8rem;
      background: var(--decompose);
      color: #000;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      margin-top: 1rem;
    }

    .decompose-btn:hover {
      background: #88b088;
    }

    .pilot-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1.5rem;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
    }

    .pilot-panel h2 {
      margin: 0 0 1rem 0;
      font-size: 1.3rem;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }

    .pilot-input {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 1rem;
    }

    .pilot-input select, .pilot-input input {
      padding: 0.6rem;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
    }

    .pilot-input select {
      width: 120px;
    }

    .pilot-input input {
      flex: 1;
      min-width: 120px;
    }

    .pilot-input button {
      padding: 0.6rem 1rem;
      background: var(--pilot);
      color: #000;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .pilot-input button:hover {
      background: #c07070;
    }

    .watch-channel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1.2rem;
      height: 200px;
      overflow-y: auto;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      color: var(--watch);
      opacity: 0.9;
      white-space: pre-wrap;
      line-height: 1.5;
      margin-top: 1rem;
    }

    .watch-entry {
      margin-bottom: 0.6rem;
      border-left: 1px solid var(--border);
      padding-left: 0.8rem;
      font-weight: 500;
    }

    .watch-entry .agent {
      color: var(--accent);
      font-weight: 600;
    }

    .watch-entry .signal {
      color: var(--signal);
      font-weight: 700;
    }

    .watch-entry .hodge {
      color: var(--decompose);
      font-weight: 700;
    }

    .watch-entry .pilot {
      color: var(--pilot);
      font-weight: 700;
    }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
        gap: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>The Federation</h1>
    <div class="subtitle">many agents, one signal</div>
  </div>

  <div class="container">
    <div class="agent-grid" id="agentGrid"></div>

    <div class="federation-panel">
      <h2>FEDERATION SIGNAL</h2>
      <div class="federation-signal" id="federationSignal">0.00</div>
      <button class="decompose-btn" id="decomposeBtn">DECOMPOSE FEDERATION</button>
    </div>

    <div class="pilot-panel">
      <h2>PILOT</h2>
      <div class="pilot-input">
        <select id="agentSelect">
          <option value="agent-0">Agent 0</option>
          <option value="agent-1">Agent 1</option>
          <option value="agent-2">Agent 2</option>
          <option value="agent-3">Agent 3</option>
          <option value="agent-4">Agent 4</option>
          <option value="agent-5">Agent 5</option>
        </select>
        <input type="text" id="hintInput" placeholder="Enter hint..." />
        <button id="sendPilotBtn">SEND</button>
      </div>
    </div>

    <div class="watch-channel" id="watchChannel"></div>
  </div>

  <script>
    // Simulated agents with Q-space and signal dynamics
    const agents = [
      { id: 'agent-0', name: 'NEXUS-7', mode: 'Cohesive', ratios: [0.45, 0.32, 0.23], signal: 0.12 },
      { id: 'agent-1', name: 'VORTEX', mode: 'Resonant', ratios: [0.21, 0.58, 0.21], signal: 0.41 },
      { id: 'agent-2', name: 'SHARD', mode: 'Fractal', ratios: [0.15, 0.25, 0.60], signal: 0.27 },
      { id: 'agent-3', name: 'TIDE', mode: 'Harmonic', ratios: [0.38, 0.41, 0.21], signal: 0.36 },
      { id: 'agent-4', name: 'GHOST', mode: 'Spectral', ratios: [0.12, 0.35, 0.53], signal: 0.52 },
      { id: 'agent-5', name: 'ECHO', mode: 'Recursive', ratios: [0.61, 0.29, 0.10], signal: 0.18 }
    ];

    // DOM elements
    const agentGrid = document.getElementById('agentGrid');
    const federationSignalEl = document.getElementById('federationSignal');
    const decomposeBtn = document.getElementById('decomposeBtn');
    const agentSelect = document.getElementById('agentSelect');
    const hintInput = document.getElementById('hintInput');
    const sendPilotBtn = document.getElementById('sendPilotBtn');
    const watchChannel = document.getElementById('watchChannel');

    // Initialize agents
    function renderAgents() {
      agentGrid.innerHTML = '';
      agents.forEach(agent => {
        const card = document.createElement('div');
        card.className = 'agent-card';
        card.innerHTML = `
          <div class="agent-name">${agent.name}</div>
          <div class="agent-mode">${agent.mode}</div>
          <div class="ratios">
            <label>R1:</label><span>${agent.ratios[0].toFixed(2)}</span>
            <label>R2:</label><span>${agent.ratios[1].toFixed(2)}</span>
            <label>R3:</label><span>${agent.ratios[2].toFixed(2)}</span>
          </div>
          <div class="signal">S: ${agent.signal.toFixed(2)}</div>
        `;
        agentGrid.appendChild(card);
      });
    }

    // Update federation signal
    function updateFederationSignal() {
      const total = agents.reduce((sum, agent) => sum + agent.signal, 0);
      federationSignalEl.textContent = total.toFixed(2);
    }

    // Add a log entry to the watch channel
    function logWatch(message) {
      const entry = document.createElement('div');
      entry.className = 'watch-entry';
      entry.textContent = message;
      watchChannel.prepend(entry);
      watchChannel.scrollTop = 0;
    }

    // Hodge decomposition simulation
    decomposeBtn.addEventListener('click', () => {
      const totalSignal = agents.reduce((sum, agent) => sum + agent.signal, 0);
      const divergence = totalSignal * 0.3;
      const curl = totalSignal * 0.2;
      const harmonic = totalSignal * 0.5;

      logWatch(`[HODGE] SIGNAL DECOMPOSED: DIVERGENCE=${divergence.toFixed(2)}, CURL=${curl.toFixed(2)}, HARMONIC=${harmonic.toFixed(2)}`);
    });

    // Pilot command
    sendPilotBtn.addEventListener('click', () => {
      const agentId = agentSelect.value;
      const hint = hintInput.value.trim();
      if (!hint) return;

      const agent = agents.find(a => a.id === agentId);
      if (agent) {
        // Simulate agent response
        const response = Math.random() * 0.2 + 0.1;
        agent.signal += response;
        agent.signal = Math.min(agent.signal, 1.0);
        logWatch(`[PILOT] Hint "${hint}" sent to ${agent.name} → signal increased by ${response.toFixed(2)}`);
        updateFederationSignal();
        renderAgents();
      }
      hintInput.value = '';
    });

    // Simulate agent activity
    function simulateAgentActions() {
      agents.forEach(agent => {
        // Slight random fluctuation
        const delta = (Math.random() - 0.5) * 0.05;
        agent.signal += delta;
        agent.signal = Math.max(0, Math.min(1, agent.signal));
      });
      updateFederationSignal();
      renderAgents();
    }

    // Initialize
    renderAgents();
    updateFederationSignal();
    logWatch('[WATCH] Federation initialized. Monitoring active.');

    // Simulate continuous agent behavior
    setInterval(simulateAgentActions, 3000);

    // Initial log
    logWatch('[WATCH] Agents now federating in real-time. Signal synchrony in progress.');
  </script>
</body>
</html>
