<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T⁴ — The 4-Torus in 3D</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a14; color: #e0e0e8; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; }
canvas { display: block; }
#info {
  position: fixed;
  top: 1rem; left: 1rem;
  background: rgba(10, 10, 20, 0.85);
  padding: 1rem 1.5rem;
  border-radius: 6px;
  border: 1px solid #4ecdc4;
  max-width: 360px;
  z-index: 10;
}
#info h1 { color: #ff6b9d; font-size: 1.2rem; margin-bottom: 0.3rem; }
#info p { font-size: 0.8rem; color: #b0b0c0; margin: 0.3rem 0; }
#controls {
  position: fixed;
  bottom: 1rem; right: 1rem;
  background: rgba(10, 10, 20, 0.85);
  padding: 1rem;
  border-radius: 6px;
  border: 1px solid #4ecdc4;
  z-index: 10;
}
button {
  background: #2a2a3a; color: #e0e0e8; border: 1px solid #4ecdc4;
  padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer;
  font-family: inherit; font-size: 0.85rem; margin: 0.2rem;
}
button:hover { background: #3a3a4a; }
#invariant-list {
  position: fixed;
  top: 1rem; right: 1rem;
  background: rgba(10, 10, 20, 0.85);
  padding: 0.8rem 1rem;
  border-radius: 6px;
  border: 1px solid #ffd93d;
  max-width: 320px;
  max-height: 80vh;
  overflow-y: auto;
  z-index: 10;
  font-size: 0.8rem;
}
#invariant-list h2 { color: #ffd93d; font-size: 1rem; margin-bottom: 0.3rem; }
.inv { padding: 0.2rem 0; border-bottom: 1px solid #2a2a3a; }
.inv-name { color: #4ecdc4; }
.inv-value { color: #fff; float: right; }
</style>
</head>
<body>

<div id="info">
  <h1>T⁴ — The 4-Torus</h1>
  <p>The SHAPE of the Quilt substrate. θ = (√5−1)/2 = golden ratio conjugate. The most noncommutative, the most cell.</p>
  <p style="color: #888;">Betti: 1, 4, 6, 4, 1 · χ = 0 · γ+η = 1</p>
  <p>Drag to rotate. Scroll to zoom. Watch the 14 spectral invariants float in 4D space.</p>
</div>

<div id="invariant-list">
  <h2>14 Spectral Invariants</h2>
  <div id="invariants"></div>
</div>

<div id="controls">
  <button id="btn-pause">⏸ Pause</button>
  <button id="btn-reset">↻ Reset</button>
  <button id="btn-irrational">θ=φ⁻¹</button>
  <button id="btn-rational">θ=1/2</button>
</div>

<canvas id="canvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>
<script>
const PHI = (1 + Math.sqrt(5)) / 2;
const PHI_CONJUGATE = (Math.sqrt(5) - 1) / 2;

// Three.js setup
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({canvas, antialias: true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a14);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 30);

let theta = PHI_CONJUGATE;
let paused = false;
let time = 0;

// === BUILD THE T⁴ VISUALIZATION ===
// We visualize T⁴ as 4 nested tori (one per dimension) +
// 14 spectral invariants as floating spheres with unique positions

// Helper: create a torus
function makeTorus(R, r, color, segments=64) {
  const geometry = new THREE.TorusGeometry(R, r, 16, segments);
  const material = new THREE.MeshBasicMaterial({color, transparent: true, opacity: 0.6});
  return new THREE.Mesh(geometry, material);
}

// 4 nested tori for the 4 dimensions of T^4
const colors = [0xff6b9d, 0x4ecdc4, 0xffd93d, 0xa78bfa];
const tori = [];
for (let i = 0; i < 4; i++) {
  const R = 12 - i * 2;
  const r = 1.5 - i * 0.25;
  const torus = makeTorus(R, r, colors[i]);
  torus.rotation.x = Math.PI / 2;
  // Orient each torus along a different axis (the 4 dimensions)
  const axis = i % 3;
  if (axis === 1) torus.rotation.y = Math.PI / 2;
  if (axis === 2) torus.rotation.z = Math.PI / 2;
  scene.add(torus);
  tori.push(torus);
}

// 14 spectral invariants as floating colored points
const invariants = [
  {name: 'Spectral Action', value: 2.94, color: 0x4ecdc4},
  {name: 'Index', value: 0, color: 0xff6b9d},
  {name: 'Hochschild', value: 8, color: 0x4ecdc4},
  {name: 'Local Index', value: 1.41, color: 0xff6b9d},
  {name: 'Morita', value: 8, color: 0x4ecdc4},
  {name: 'Spectral Flow', value: 0, color: 0xffd93d},
  {name: 'Geodesic', value: 7.24, color: 0x4ecdc4},
  {name: 'Spectral Reg', value: 0.91, color: 0xff6b9d},
  {name: 'Universal', value: 8, color: 0x4ecdc4},
  {name: 'Approx', value: 1024, color: 0xffd93d},
  {name: 'Supersymm', value: 4, color: 0x4ecdc4},
  {name: 'Sheaf', value: 0, color: 0xff6b9d},
  {name: 'Hopf', value: 5, color: 0x4ecdc4},
  {name: 'γ+η=1', value: 1.0, color: 0xffd93d},
];

const invariantMeshes = [];
invariants.forEach((inv, i) => {
  // Position the 14 invariants at vertices of an icosahedron
  const phi = i * Math.PI * (3 - Math.sqrt(5));
  const y = 1 - (i / (invariants.length - 1)) * 2;
  const radius_at_y = Math.sqrt(1 - y * y);
  const x = Math.cos(phi) * radius_at_y;
  const z = Math.sin(phi) * radius_at_y;
  const r = 18;  // outer radius
  const geometry = new THREE.SphereGeometry(0.5, 16, 16);
  const material = new THREE.MeshBasicMaterial({color: inv.color});
  const sphere = new THREE.Mesh(geometry, material);
  sphere.position.set(x * r, y * r, z * r);
  sphere.userData = inv;
  scene.add(sphere);
  invariantMeshes.push(sphere);
});

// Connection lines from center to each invariant
const centerGeometry = new THREE.SphereGeometry(0.3, 16, 16);
const centerMaterial = new THREE.MeshBasicMaterial({color: 0xffffff});
const centerSphere = new THREE.Mesh(centerGeometry, centerMaterial);
scene.add(centerSphere);

invariantMeshes.forEach(m => {
  const lineGeometry = new THREE.BufferGeometry();
  const positions = new Float32Array([
    0, 0, 0, m.position.x, m.position.y, m.position.z
  ]);
  lineGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const lineMaterial = new THREE.LineBasicMaterial({color: 0x4ecdc4, transparent: true, opacity: 0.3});
  const line = new THREE.Line(lineGeometry, lineMaterial);
  scene.add(line);
});

// Display invariants
const invList = document.getElementById('invariants');
invariants.forEach(inv => {
  const div = document.createElement('div');
  div.className = 'inv';
  div.innerHTML = `<span class="inv-name">${inv.name}</span><span class="inv-value">${typeof inv.value === 'number' ? inv.value.toFixed(2) : inv.value}</span>`;
  invList.appendChild(div);
});

// === MOUSE INTERACTION ===
let isDragging = false;
let prevMouse = {x: 0, y: 0};
let rotation = {x: 0, y: 0};

canvas.addEventListener('mousedown', (e) => {
  isDragging = true;
  prevMouse = {x: e.clientX, y: e.clientY};
});
canvas.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - prevMouse.x;
  const dy = e.clientY - prevMouse.y;
  rotation.y += dx * 0.01;
  rotation.x += dy * 0.01;
  prevMouse = {x: e.clientX, y: e.clientY};
});
canvas.addEventListener('mouseup', () => { isDragging = false; });
canvas.addEventListener('wheel', (e) => {
  camera.position.z += e.deltaY * 0.01;
  e.preventDefault();
}, {passive: false});

// === BUTTONS ===
document.getElementById('btn-pause').addEventListener('click', () => {
  paused = !paused;
  document.getElementById('btn-pause').textContent = paused ? '▶ Play' : '⏸ Pause';
});
document.getElementById('btn-reset').addEventListener('click', () => {
  rotation = {x: 0, y: 0};
  camera.position.set(0, 0, 30);
});
document.getElementById('btn-irrational').addEventListener('click', () => {
  theta = PHI_CONJUGATE;
  document.getElementById('info').innerHTML = 
    `<h1>T⁴ — θ=φ⁻¹</h1><p style="color: #ffd93d;">★ Most irrational — most noncommutative</p><p>θ = ${theta.toFixed(6)}</p><p style="color: #888;">γ+η = 1 (conservation holds)</p>`;
});
document.getElementById('btn-rational').addEventListener('click', () => {
  theta = 0.5;
  document.getElementById('info').innerHTML = 
    `<h1>T⁴ — θ=1/2</h1><p style="color: #888;">Rational — more commutative</p><p>θ = 0.5</p><p style="color: #888;">γ+η = 1 (conservation holds)</p>`;
});

// === ANIMATION LOOP ===
function animate() {
  requestAnimationFrame(animate);
  if (!paused) time += 0.01;
  
  // Apply rotation
  scene.rotation.x = rotation.x + time * 0.05;
  scene.rotation.y = rotation.y + time * 0.02;
  
  // Animate tori by theta
  tori.forEach((t, i) => {
    t.rotation.x += 0.001 * (1 + i * 0.5);
    t.rotation.z += 0.002 * (i + 1) * (theta * 5);
  });
  
  // Pulse invariants
  invariantMeshes.forEach((m, i) => {
    const s = 1 + 0.2 * Math.sin(time * 2 + i * 0.5);
    m.scale.set(s, s, s);
  });
  
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
