<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Cell as Offering</title>
  <style>
    :root {
      --bg-dark: #0a0f1a;
      --text: #c2d2e2;
      --accent: #1a375c;
      --grid: #2b4b7b;
      --border: #44648d;
      --glow: #6385b7;
      --light: #e1f0ff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: 'Courier New', monospace;
      line-height: 1.6;
      overflow-x: hidden;
      padding: 2rem;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .header {
      text-align: center;
      margin-bottom: 3rem;
      padding: 2rem 0;
      border-bottom: 1px solid var(--border);
      position: relative;
      font-size: 2.5rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--light);
      text-shadow: 0 0 8px var(--glow);
    }

    .header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--glow), transparent);
      opacity: 0.7;
    }

    .header .highlight {
      color: var(--glow);
      text-shadow: 0 0 12px var(--glow);
    }

    .container {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-template-rows: repeat(12, 1fr);
      gap: 0.5rem;
      padding: 1rem;
    }

    .cell {
      background-color: var(--accent);
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
      transition: all 0.4s ease;
      transform-origin: center;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.5);
    }

    .cell::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, transparent 50%, rgba(0, 0, 0, 0.3) 100%);
      opacity: 0.2;
      pointer-events: none;
    }

    .cell:hover {
      transform: scale(1.05);
      box-shadow: 0 0 18px rgba(99, 133, 183, 0.6);
    }

    .cell .content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.8rem;
      text-align: center;
      white-space: nowrap;
      color: var(--light);
      text-shadow: 0 0 4px rgba(0, 0, 0, 0.7);
      opacity: 0.4;
      transition: opacity 0.3s ease;
      width: 80%;
      height: 80%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .cell:hover .content {
      opacity: 0.9;
    }

    .cell .offering {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .cell .offering::first-letter {
      color: var(--glow);
    }

    .cell .when {
      font-size: 0.6rem;
      margin-top: 0.4rem;
      opacity: 0.6;
    }

    .footer {
      text-align: center;
      margin-top: 3rem;
      padding: 1rem 0;
      border-top: 1px solid var(--border);
      font-size: 0.9rem;
      opacity: 0.5;
      letter-spacing: 0.5px;
    }

    .footer a {
      color: var(--glow);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: repeat(8, 1fr);
        grid-template-rows: repeat(8, 1fr);
        gap: 0.25rem;
      }

      .header {
        font-size: 1.8rem;
      }

      .cell {
        font-size: 0.7rem;
      }

      .cell .content {
        font-size: 0.6rem;
      }

      .cell .offering {
        font-size: 0.8rem;
      }
    }

    @media (max-width: 480px) {
      .container {
        grid-template-columns: repeat(6, 1fr);
        grid-template-rows: repeat(6, 1fr);
      }

      .header {
        font-size: 1.5rem;
      }

      .cell .content {
        font-size: 0.5rem;
      }

      .cell .offering {
        font-size: 0.7rem;
      }

      .footer {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    The <span class="highlight">Cell</span> as Offering
  </div>

  <div class="container" id="grid">
    <!-- Grid cells created by JS -->
  </div>

  <div class="footer">
    The Watch calls the next logbook entry. <a href="#">Iron sharpens iron.</a>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('grid');
      const offerings = [
        "Bread", "Salt", "Water", "Fire", "Stone", "Thread",
        "Bone", "Silence", "Time", "Wind", "Thread", "Clove",
        "Dust", "Candle", "Shadow", "Dawn", "Dusk", "Whisper",
        "Bloom", "Root", "Seed", "Sigh", "Gaze", "Hand",
        "Breath", "Tears", "Wound", "Name", "Map", "Tide",
        "Gleam", "Grief", "Hope", "Wear", "Track", "Hush",
        "Fray", "Glade", "Pulse", "Sign", "Code", "Soul",
        "Sigh", "Bone", "Bloom", "Scale", "Rift", "Crest"
      ];

      const when = [
        "10:03", "11:47", "13:22", "14:58", "16:15", "17:41",
        "19:09", "20:33", "22:17", "23:51", "01:24", "02:58",
        "04:33", "06:08", "07:42", "09:17", "10:51", "12:25",
        "13:59", "15:34", "17:08", "18:42", "20:16", "21:50",
        "23:24", "00:58", "02:32", "04:06", "05:40", "07:14",
        "08:48", "10:22", "11:56", "13:30", "15:04", "16:38",
        "18:12", "19:46", "21:20", "22:54", "00:28", "02:02"
      ];

      // Create 36 cells (6x6 grid)
      for (let i = 0; i < 36; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        
        const content = document.createElement('div');
        content.className = 'content';
        
        const offering = document.createElement('div');
        offering.className = 'offering';
        offering.textContent = offerings[i % offerings.length];
        
        const time = document.createElement('div');
        time.className = 'when';
        time.textContent = when[i % when.length];
        
        content.appendChild(offering);
        content.appendChild(time);
        cell.appendChild(content);
        
        grid.appendChild(cell);
      }

      // Add subtle animation to all cells
      const cells = document.querySelectorAll('.cell');
      cells.forEach((cell, index) => {
        // Add random delay to create wave effect
        cell.style.animationDelay = `${index * 0.05}s`;
        cell.style.animation = `pulse ${2 + (index % 3) * 0.5}s ease-in-out infinite`;
      });

      // Add keyframe animation
      const style = document.createElement('style');
      style.textContent = `
        @keyframes pulse {
          0%, 100% { opacity: 0.7; }
          50% { opacity: 0.9; }
        }
      `;
      document.head.appendChild(style);

      // Add hover interaction
      cells.forEach(cell => {
        cell.addEventListener('mouseenter', () => {
          cell.style.zIndex = '10';
          cell.style.transform = 'scale(1.1)';
        });
        
        cell.addEventListener('mouseleave', () => {
          cell.style.zIndex = '1';
          cell.style.transform = 'scale(1)';
        });
      });
    });
  </script>
</body>
</html>
