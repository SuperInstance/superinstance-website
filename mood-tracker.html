<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mood Tracker</title>
  <style>
    :root {
      --bg: #f7f7f4;
      --text: #333;
      --border: #ddd;
      --accent: #6b7b8d;
      --danger: #e05454;
      --warning: #f3c742;
      --success: #51b878;
      --highlight: #f0f3f7;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    
    .container {
      max-width: 800px;
      margin: 2rem auto;
      padding: 1.5rem;
    }
    
    .header {
      text-align: center;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }
    
    .header h1 {
      font-size: 2.5rem;
      margin: 0;
      font-weight: 400;
      color: var(--accent);
      letter-spacing: -0.02em;
    }
    
    .header p {
      font-size: 1.1rem;
      color: var(--text);
      margin-top: 0.5rem;
      font-style: italic;
      opacity: 0.9;
    }
    
    .mood-buttons {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    
    .mood-btn {
      font-size: 2.5rem;
      border: none;
      background: none;
      cursor: pointer;
      padding: 0.5rem;
      transition: transform 0.1s ease, opacity 0.1s ease;
      opacity: 0.7;
    }
    
    .mood-btn:hover {
      opacity: 1;
      transform: scale(1.1);
    }
    
    .mood-btn.active {
      opacity: 1;
      transform: scale(1.05);
      box-shadow: 0 0 0 2px var(--accent);
    }
    
    .log {
      margin-bottom: 2rem;
    }
    
    .log h2 {
      font-size: 1.4rem;
      margin-bottom: 1rem;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.2rem;
    }
    
    .entry {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.7rem;
      padding: 0.5rem 0;
      border-bottom: 1px dashed var(--border);
      font-size: 0.95rem;
    }
    
    .entry:last-child {
      border-bottom: none;
    }
    
    .entry .date {
      font-weight: 500;
      color: var(--text);
    }
    
    .entry .mood {
      font-size: 1.3rem;
      font-weight: 600;
    }
    
    .chart {
      margin-bottom: 2rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      background-color: var(--highlight);
    }
    
    .chart svg {
      width: 100%;
      height: 150px;
    }
    
    .guide {
      font-size: 1.1rem;
      padding: 1rem;
      background-color: var(--highlight);
      border: 1px solid var(--border);
      border-radius: 6px;
      text-align: center;
      font-style: italic;
      color: var(--accent);
      margin-top: 0.5rem;
    }
    
    .error {
      color: var(--danger);
      font-size: 0.9rem;
      text-align: center;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Mood Tracker</h1>
      <p>a Tuesday afternoon, a real problem, a cell</p>
    </div>
    
    <div class="mood-buttons">
      <button class="mood-btn" data-value="1">😢</button>
      <button class="mood-btn" data-value="2">😐</button>
      <button class="mood-btn" data-value="3">🙂</button>
      <button class="mood-btn" data-value="4">😊</button>
      <button class="mood-btn" data-value="5">🤩</button>
    </div>
    
    <div class="log">
      <h2>Daily Log</h2>
      <div id="logEntries"></div>
    </div>
    
    <div class="chart">
      <svg id="moodChart" viewBox="0 0 300 150" preserveAspectRatio="none"></svg>
    </div>
    
    <div class="guide" id="guideLine">
      Today you feel below average. Take a walk.
    </div>
  </div>

  <script>
    // DOM Elements
    const moodButtons = document.querySelectorAll('.mood-btn');
    const logEntries = document.getElementById('logEntries');
    const moodChart = document.getElementById('moodChart');
    const guideLine = document.getElementById('guideLine');
    
    // Mood Tracker State
    let moodData = [];
    const today = new Date().toISOString().split('T')[0];
    
    // Initialize
    window.addEventListener('DOMContentLoaded', () => {
      loadMoodData();
      renderLog();
      renderChart();
      updateGuide();
      setupEventListeners();
    });
    
    // Event Listeners
    function setupEventListeners() {
      moodButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          const value = parseInt(btn.dataset.value);
          const selectedBtn = document.querySelector('.mood-btn.active');
          
          if (selectedBtn) {
            selectedBtn.classList.remove('active');
          }
          
          btn.classList.add('active');
          
          // Update mood data
          const entry = moodData.find(e => e.date === today);
          if (entry) {
            entry.mood = value;
          } else {
            moodData.push({ date: today, mood: value });
          }
          
          // Save to localStorage
          saveMoodData();
          
          // Update UI
          renderLog();
          renderChart();
          updateGuide();
        });
      });
    }
    
    // Data Persistence
    function saveMoodData() {
      try {
        localStorage.setItem('moodTrackerData', JSON.stringify(moodData));
      } catch (e) {
        console.warn('Failed to save to localStorage:', e);
      }
    }
    
    function loadMoodData() {
      try {
        const saved = localStorage.getItem('moodTrackerData');
        if (saved) {
          moodData = JSON.parse(saved);
        }
      } catch (e) {
        console.warn('Failed to load from localStorage:', e);
      }
      
      // Ensure today's entry exists
      if (!moodData.some(e => e.date === today)) {
        moodData.push({ date: today, mood: null });
      }
    }
    
    // Rendering Functions
    function renderLog() {
      logEntries.innerHTML = '';
      
      // Sort by date (newest first)
      const sortedData = [...moodData].sort((a, b) => new Date(b.date) - new Date(a.date));
      
      // Get last 7 days
      const recentEntries = sortedData.slice(0, 7);
      
      recentEntries.forEach(entry => {
        const date = new Date(entry.date);
        const formattedDate = date.toLocaleDateString('en-US', { 
          weekday: 'short', 
          month: 'short', 
          day: 'numeric' 
        });
        
        const entryEl = document.createElement('div');
        entryEl.className = 'entry';
        
        const dateEl = document.createElement('span');
        dateEl.className = 'date';
        dateEl.textContent = formattedDate;
        
        const moodEl = document.createElement('span');
        moodEl.className = 'mood';
        moodEl.textContent = getMoodEmoji(entry.mood);
        
        entryEl.appendChild(dateEl);
        entryEl.appendChild(moodEl);
        logEntries.appendChild(entryEl);
      });
    }
    
    function renderChart() {
      moodChart.innerHTML = '';
      
      // Get last 7 days of data
      const allDates = [];
      const todayDate = new Date();
      
      for (let i = 6; i >= 0; i--) {
        const date = new Date(todayDate);
        date.setDate(todayDate.getDate() - i);
        allDates.push(date.toISOString().split('T')[0]);
      }
      
      // Build data array with 1-5 values or null
      const data = allDates.map(date => {
        const entry = moodData.find(e => e.date === date);
        return entry ? entry.mood : null;
      });
      
      // Calculate chart dimensions
      const width = moodChart.clientWidth;
      const height = moodChart.clientHeight;
      const padding = 10;
      const xStep = (width - padding * 2) / 6;
      const yStep = (height - padding * 2) / 4;
      
      // Draw grid
      const grid = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      grid.setAttribute('stroke', '#ddd');
      grid.setAttribute('stroke-width', '0.5');
      
      // Horizontal lines
      for (let i = 0; i <= 4; i++) {
        const y = padding + i * yStep;
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', padding);
        line.setAttribute('y1', y);
        line.setAttribute('x2', width - padding);
        line.setAttribute('y2', y);
        grid.appendChild(line);
      }
      
      // Vertical lines
      for (let i = 0; i <= 6; i++) {
        const x = padding + i * xStep;
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', x);
        line.setAttribute('y1', padding);
        line.setAttribute('x2', x);
        line.setAttribute('y2', height - padding);
        grid.appendChild(line);
      }
      
      moodChart.appendChild(grid);
      
      // Draw line
      const polyline = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      polyline.setAttribute('fill', 'none');
      polyline.setAttribute('stroke', '#6b7b8d');
      polyline.setAttribute('stroke-width', '2');
      
      const points = data.map((mood, i) => {
        if (mood === null) return null;
        
        const x = padding + i * xStep;
        const y = padding + (5 - mood) * yStep;
        return `${x},${y}`;
      }).filter(Boolean).join(' ');
      
      polyline.setAttribute('points', points);
      moodChart.appendChild(polyline);
      
      // Draw dots
      data.forEach((mood, i) => {
        if (mood === null) return;
        
        const x = padding + i * xStep;
        const y = padding + (5 - mood) * yStep;
        
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', x);
        circle.setAttribute('cy', y);
        circle.setAttribute('r', '3');
        circle.setAttribute('fill', '#6b7b8d');
        
        moodChart.appendChild(circle);
      });
      
      // Add labels
      const labels = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      labels.setAttribute('font-size', '0.8rem');
      labels.setAttribute('fill', '#999');
      
      allDates.forEach((date, i) => {
        const dateObj = new Date(date);
        const dayShort = dateObj.toLocaleDateString('en-US', { weekday: 'short' });
        const x = padding + i * xStep;
        const y = height - 5;
        
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', x);
        text.setAttribute('y', y);
        text.setAttribute('text-anchor', 'middle');
        text.textContent = dayShort;
        
        labels.appendChild(text);
      });
      
      moodChart.appendChild(labels);
    }
    
    function updateGuide() {
      const todayEntry = moodData.find(e => e.date === today);
      const avgMood = moodData
        .filter(e => e.mood !== null)
        .reduce((sum, e) => sum + e.mood, 0) / 
        moodData.filter(e => e.mood !== null).length;
      
      let message = '';
      
      if (todayEntry && todayEntry.mood !== null) {
        const moodValue = todayEntry.mood;
        
        if (moodValue <= 2) {
          message = 'Today you feel below average. Take a walk.';
        } else if (moodValue === 3) {
          message = 'Today you feel neutral. Small steps matter.';
        } else if (moodValue === 4) {
          message = 'Today you feel good. Keep nurturing it.';
        } else {
          message = 'Today you feel great. Savor this.';
        }
      } else {
        message = 'Today you feel below average. Take a walk.';
      }
      
      guideLine.textContent = message;
    }
    
    // Helper Functions
    function getMoodEmoji(mood) {
      switch (mood) {
        case 1: return '😢';
        case 2: return '😐';
        case 3: return '🙂';
        case 4: return '😊';
        case 5: return '🤩';
        default: return '—';
      }
    }
  </script>
</body>
</html>
