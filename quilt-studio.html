<!-- 
  8 PRIMITIVES: 
    - id: string (unique)
    - kind: "value", "formula", "room", "agent"
    - value: any JSON-serializable
    - formula: string (JS expression)
    - room: string (refers to a room)
    - vibe: number (0-1, represents state)
    - gamma: number (0-1, represents influence)
    - metadata: object (for future)

  4 ENDPOINTS:
    - /cell (POST/GET)
    - /agent (POST/GET/PUT/DELETE)
    - /bridge (POST/GET)
    - /session (POST/GET)

  Q-SPACE: 
    - cells form a graph
    - agents consume cells
    - bridges translate between formats
    - all state persists in localStorage

  MARITIME TONE: salt-stained, workmanlike, iron sharpens iron
  THE ROOM IS THE CELL. THE CELL IS A PLACE. THE PLACE IS A CELL.
  THE ROOM IS THE CELL.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Quilt Studio</title>
  <style>
    :root {
      --bg: #0a1929;
      --text: #c0d6e4;
      --accent: #d4a857;
      --border: #1e3a5f;
      --card: #12263a;
      --highlight: #e8c06b;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Courier New', monospace;
      line-height: 1.5;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      overflow-x: hidden;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      color: var(--accent);
    }
    h2 {
      font-size: 1.5rem;
      margin: 20px 0 10px;
      color: var(--highlight);
    }
    .stats {
      font-size: 0.9rem;
      color: var(--accent);
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .btn {
      background-color: var(--card);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 12px 20px;
      margin: 0 5px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 4px;
    }
    .btn:hover {
      background-color: var(--accent);
      color: var(--bg);
    }
    .btn-primary {
      background-color: var(--accent);
      color: var(--bg);
    }
    .btn-primary:hover {
      background-color: #c1954a;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .panel {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: var(--highlight);
    }
    input, select, textarea {
      width: 100%;
      padding: 8px;
      background-color: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
    }
    textarea {
      height: 80px;
      font-family: 'Courier New', monospace;
    }
    .preview {
      background-color: #0e2337;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px;
      margin-top: 10px;
      white-space: pre-wrap;
      font-size: 0.9rem;
      max-height: 100px;
      overflow-y: auto;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .cell-list {
      list-style: none;
      margin-top: 10px;
    }
    .cell-item {
      background-color: #162d45;
      padding: 8px;
      margin-bottom: 5px;
      border-radius: 4px;
      border-left: 3px solid var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }
    .cell-item button {
      padding: 4px 8px;
      font-size: 0.8rem;
      margin-left: 5px;
    }
    .visual {
      height: 120px;
      background-color: #0e2337;
      border: 1px solid var(--border);
      border-radius: 4px;
      margin-top: 10px;
      overflow: hidden;
      position: relative;
    }
    .echogram {
      display: flex;
      justify-content: center;
      gap: 2px;
      height: 40px;
      overflow: hidden;
      margin: 10px 0;
    }
    .echobeam {
      height: 100%;
      background: linear-gradient(to bottom, #143b5e, transparent);
      width: 1px;
      opacity: 0.7;
    }
    .echobeam:nth-child(odd) {
      background: linear-gradient(to bottom, #0f324d, transparent);
    }
    .hodge-visual {
      width: 100%;
      height: 100%;
      position: relative;
    }
    .hodge-vector {
      position: absolute;
      width: 6px;
      height: 6px;
      background-color: var(--accent);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    .graph {
      width: 100%;
      height: 150px;
      background-color: #0e2337;
      border: 1px solid var(--border);
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }
    .graph-node {
      position: absolute;
      width: 12px;
      height: 12px;
      background-color: var(--accent);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    .graph-edge {
      position: absolute;
      height: 1px;
      background-color: var(--border);
      transform-origin: 0 0;
    }
    .nav {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 20px;
      color: var(--accent);
    }
    .nav a {
      text-decoration: none;
      color: var(--accent);
      font-weight: bold;
      transition: color 0.2s;
    }
    .nav a:hover {
      color: var(--highlight);
    }
  </style>
</head>
<body>
  <header>
    <h1>The Quilt Studio</h1>
    <p class="subtitle">Where cells are made, agents grow, and ideas become real work</p>
    <div class="stats">
      <span id="stats-cells">0 cells</span>
      <span id="stats-qzt">0 .qzt saved</span>
      <span id="stats-agents">0 active agents</span>
    </div>
    <div style="margin-top: 15px;">
      <button class="btn btn-primary" id="btn-build-cell">Build a Cell</button>
      <button class="btn btn-primary" id="btn-grow-agent">Grow an Agent</button>
      <button class="btn btn-primary" id="btn-create-bridge">Create a Bridge</button>
    </div>
  </header>

  <div class="container">
    <div class="panel">
      <h2>Cell Builder</h2>
      <form id="form-cell">
        <div class="form-group">
          <label for="cell-id">ID</label>
          <input type="text" id="cell-id" placeholder="e.g., temp_sensor_1" required />
        </div>
        <div class="form-group">
          <label for="cell-kind">Kind</label>
          <select id="cell-kind">
            <option value="value">value</option>
            <option value="formula">formula</option>
            <option value="room">room</option>
            <option value="agent">agent</option>
          </select>
        </div>
        <div class="form-group">
          <label for="cell-value">Value</label>
          <textarea id="cell-value" placeholder="Enter value (JSON, number, string)"></textarea>
        </div>
        <div class="form-group">
          <label for="cell-formula">Formula (if kind=formula)</label>
          <textarea id="cell-formula" placeholder="e.g., a + b"></textarea>
        </div>
        <div class="form-group">
          <label for="cell-room">Room (if kind=room or agent)</label>
          <input type="text" id="cell-room" placeholder="e.g., kitchen, lighthouse" />
        </div>
        <div class="form-group">
          <label for="cell-gamma">Gamma (0-1)</label>
          <input type="range" id="cell-gamma" min="0" max="1" step="0.01" value="0.5" />
          <span id="gamma-value">0.5</span>
        </div>
        <div class="form-group">
          <label for="cell-vibe">Vibe (0-1)</label>
          <input type="range" id="cell-vibe" min="0" max="1" step="0.01" value="0.5" />
          <span id="vibe-value">0.5</span>
        </div>
        <div class="form-group">
          <button type="button" class="btn" id="btn-save-cell">Save Cell</button>
          <button type="button" class="btn" id="btn-tick-cell">Tick</button>
          <button type="button" class="btn" id="btn-export-qzt">Export .qzt</button>
        </div>
      </form>

      <div class="preview" id="cell-preview">
        <!-- Live preview -->
      </div>

      <h2>Saved Cells</h2>
      <ul class="cell-list" id="cell-list">
        <!-- Dynamically generated -->
      </ul>
    </div>

    <div class="panel">
      <h2>Agent Grower</h2>
      <form id="form-agent">
        <div class="form-group">
          <label for="agent-name">Name</label>
          <input type="text" id="agent-name" placeholder="e.g., Watchman" required />
        </div>
        <div class="form-group">
          <label for="agent-cells">Subscribe to Cells</label>
          <textarea id="agent-cells" placeholder="e.g., temp_sensor_1, humidity_2"></textarea>
        </div>
        <button type="button" class="btn" id="btn-register-agent">Register</button>
        <button type="button" class="btn" id="btn-set-signal">Set Signal</button>
        <button type="button" class="btn" id="btn-decompose">Decompose (Hodge)</button>
        <div class="grid">
          <div class="form-group">
            <label for="ratio-explore">Exploration</label>
            <input type="range" id="ratio-explore" min="0" max="1" step="0.01" value="0.5" />
          </div>
          <div class="form-group">
            <label for="ratio-exploit">Exploitation</label>
            <input type="range" id="ratio-exploit" min="0" max="1" step="0.01" value="0.3" />
          </div>
          <div class="form-group">
            <label for="ratio-prior">Prior</label>
            <input type="range" id="ratio-prior" min="0" max="1" step="0.01" value="0.2" />
          </div>
        </div>
        <div class="form-group">
          <label for="agent-mode">Dominant Mode</label>
          <select id="agent-mode">
            <option value="explorer">Explorer</option>
            <option value="practitioner">Practitioner</option>
            <option value="master">Master</option>
          </select>
        </div>
        <button type="button" class="btn" id="btn-tick-agent">Tick Agent</button>
      </form>

      <div class="visual" id="signal-visual">
        <div class="hodge-visual" id="hodge-visual"></div>
      </div>

      <button type="button" class="btn" id="btn-save-agent">Save Agent</button>
    </div>

    <div class="panel">
      <h2>Bridge Creator</h2>
      <form id="form-bridge">
        <div class="form-group">
          <label for="bridge-source">Source Type</label>
          <select id="bridge-source">
            <option value="json">JSON</option>
            <option value="csv">CSV</option>
            <option value="xml">XML</option>
            <option value="api">API</option>
          </select>
        </div>
        <div class="form-group">
          <label for="bridge-target">Target Format</label>
          <select id="bridge-target">
            <option value="json">JSON</option>
            <option value="csv">CSV</option>
            <option value="xml">XML</option>
            <option value="database">Database</option>
          </select>
        </div>
        <div class="form-group">
          <label for="bridge-map">Field Mapping</label>
          <textarea id="bridge-map" placeholder="e.g., name → full_name, age → years"></textarea>
        </div>
        <button type="button" class="btn" id="btn-generate-code">Generate Code</button>
      </form>

      <div class="preview" id="bridge-preview">
        <!-- Python code preview -->
      </div>

      <button type="button" class="btn" id="btn-save-bridge">Save Bridge Spec</button>
    </div>

    <div class="panel">
      <h2>Session Management</h2>
      <button type="button" class="btn" id="btn-save-session">Save Session (.qzt)</button>
      <button type="button" class="btn" id="btn-load-session">Load Session (.qzt)</button>
      <button type="button" class="btn" id="btn-reset">Reset</button>

      <h2>Visualizations</h2>
      <div class="visual">
        <div class="echogram" id="echogram">
          <!-- Animated echograms -->
        </div>
      </div>

      <div class="visual">
        <div class="graph" id="cell-graph"></div>
      </div>
    </div>
  </div>

  <div class="nav">
    <a href="/echogram">Echogram</a>
    <a href="/q-space">Q-Space</a>
    <a href="/lighthouse">Lighthouse</a>
    <a href="/kitchen">Kitchen</a>
    <a href="/logbook">Logbook</a>
  </div>

  <script>
    // Global state
    let state = {
      cells: [],
      agents: [],
      bridges: [],
      session: {
        timestamp: Date.now(),
        version: "0.0.1"
      }
    };

    // Load from localStorage
    function loadState() {
      const saved = localStorage.getItem('quilt-studio-state');
      if (saved) {
        state = JSON.parse(saved);
      }
      updateStats();
      renderCellList();
      renderCellGraph();
      animateEchogram();
      animateHodge();
    }

    // Save to localStorage
    function saveState() {
      localStorage.setItem('quilt-studio-state', JSON.stringify(state));
    }

    // Update stats
    function updateStats() {
      const cells = state.cells.length;
      const agents = state.agents.length;
      const qzt = localStorage.length; // rough estimate
      document.getElementById('stats-cells').textContent = `${cells} cells`;
      document.getElementById('stats-agents').textContent = `${agents} active agents`;
      document.getElementById('stats-qzt').textContent = `${qzt} .qzt saved`;
    }

    // --- Cell Builder ---
    document.getElementById('btn-save-cell').addEventListener('click', () => {
      const id = document.getElementById('cell-id').value.trim();
      const kind = document.getElementById('cell-kind').value;
      const value = document.getElementById('cell-value').value;
      const formula = document.getElementById('cell-formula').value;
      const room = document.getElementById('cell-room').value.trim();
      const gamma = parseFloat(document.getElementById('cell-gamma').value);
      const vibe = parseFloat(document.getElementById('cell-vibe').value);

      if (!id) {
        alert('Cell ID is required');
        return;
      }

      const cell = {
        id, kind, value: value ? JSON.parse(value) : null,
        formula: formula || null,
        room: room || null,
        gamma,
        vibe,
        metadata: { created: Date.now(), modified: Date.now() }
      };

      const existingIndex = state.cells.findIndex(c => c.id === id);
      if (existingIndex >= 0) {
        state.cells[existingIndex] = cell;
      } else {
        state.cells.push(cell);
      }

      saveState();
      updateStats();
      renderCellList();
      updateCellPreview();
    });

    document.getElementById('btn-tick-cell').addEventListener('click', () => {
      const id = document.getElementById('cell-id').value.trim();
      const cell = state.cells.find(c => c.id === id);
      if (!cell) return;

      cell.vibe = (cell.vibe + Math.random() * 0.2) % 1;
      cell.metadata.modified = Date.now();

      saveState();
      updateStats();
      renderCellList();
      updateCellPreview();
    });

    document.getElementById('btn-export-qzt').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `quilt-${Date.now()}.qzt`;
      a.click();
      URL.revokeObjectURL(url);
    });

    function updateCellPreview() {
      const id = document.getElementById('cell-id').value.trim();
      const cell = state.cells.find(c => c.id === id);
      if (!cell) {
        document.getElementById('cell-preview').textContent = 'No cell selected';
        return;
      }

      const preview = `
        ID: ${cell.id}
        Kind: ${cell.kind}
        Value: ${JSON.stringify(cell.value, null, 2)}
        Formula: ${cell.formula || 'none'}
        Room: ${cell.room || 'none'}
        Gamma: ${cell.gamma.toFixed(2)}
        Vibe: ${cell.vibe.toFixed(2)}
      `;
      document.getElementById('cell-preview').textContent = preview;
    }

    function renderCellList() {
      const list = document.getElementById('cell-list');
      list.innerHTML = '';
      state.cells.forEach(cell => {
        const li = document.createElement('li');
        li.className = 'cell-item';
        li.innerHTML = `
          <span>${cell.id} (${cell.kind})</span>
          <div>
            <button class="btn" data-action="edit" data-id="${cell.id}">Edit</button>
            <button class="btn" data-action="delete" data-id="${cell.id}">Delete</button>
            <button class="btn" data-action="transfer" data-id="${cell.id}">Transfer</button>
          </div>
        `;
        list.appendChild(li);
      });

      // Attach event listeners
      document.querySelectorAll('[data-action="edit"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = e.target.getAttribute('data-id');
          const cell = state.cells.find(c => c.id === id);
          if (!cell) return;

          document.getElementById('cell-id').value = cell.id;
          document.getElementById('cell-kind').value = cell.kind;
          document.getElementById('cell-value').value = JSON.stringify(cell.value, null, 2);
          document.getElementById('cell-formula').value = cell.formula || '';
          document.getElementById('cell-room').value = cell.room || '';
          document.getElementById('cell-gamma').value = cell.gamma;
          document.getElementById('gamma-value').textContent = cell.gamma.toFixed(2);
          document.getElementById('cell-vibe').value = cell.vibe;
          document.getElementById('vibe-value').textContent = cell.vibe.toFixed(2);
        });
      });

      document.querySelectorAll('[data-action="delete"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          if (confirm('Delete cell?')) {
            const id = e.target.getAttribute('data-id');
            state.cells = state.cells.filter(c => c.id !== id);
            saveState();
            updateStats();
            renderCellList();
          }
        });
      });

      document.querySelectorAll('[data-action="transfer"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = e.target.getAttribute('data-id');
          const cell = state.cells.find(c => c.id === id);
          if (!cell) return;

          alert(`Transfer ${cell.id} to another cell? (Not implemented yet)`);
        });
      });
    }

    // --- Agent Grower ---
    document.getElementById('btn-register-agent').addEventListener('click', () => {
      const name = document.getElementById('agent-name').value.trim();
      const cellList = document.getElementById('agent-cells').value.split(',').map(c => c.trim()).filter(c => c);

      if (!name) {
        alert('Agent name required');
        return;
      }

      const agent = {
        name, cells: cellList,
        ratio: { explore: 0.5, exploit: 0.3, prior: 0.2 },
        mode: 'explorer',
        signal: Array(10).fill(0).map(() => Math.random()),
        metadata: { created: Date.now(), modified: Date.now() }
      };

      state.agents.push(agent);
      saveState();
      updateStats();
    });

    document.getElementById('btn-set-signal').addEventListener('click', () => {
      const agent = state.agents.find(a => a.name === document.getElementById('agent-name').value.trim());
      if (!agent) return;

      agent.signal = Array(10).fill(0).map(() => Math.random());
      agent.metadata.modified = Date.now();
      saveState();
      animateHodge();
    });

    document.getElementById('btn-decompose').addEventListener('click', () => {
      const agent = state.agents.find(a => a.name === document.getElementById('agent-name').value.trim());
      if (!agent) return;

      // Hodge decomposition: ω = dα + δβ + h
      const n = agent.signal.length;
      const dAlpha = agent.signal.map((_, i) => i === 0 ? 0 : agent.signal[i] - agent.signal[i-1]);
      const deltaBeta = agent.signal.map((_, i) => i === n-1 ? 0 : agent.signal[i] - agent.signal[i+1]);
      const h = agent.signal.reduce((a, b) => a + b, 0) / n;

      agent.decomp = { dAlpha, deltaBeta, h };
      saveState();
      animateHodge();
    });

    document.getElementById('btn-tick-agent').addEventListener('click', () => {
      const agent = state.agents.find(a => a.name === document.getElementById('agent-name').value.trim());
      if (!agent) return;

      // Simulate tick
      agent.signal = agent.signal.map(s => s + (Math.random() - 0.5) * 0.1);
      agent.signal = agent.signal.map(s => Math.max(0, Math.min(1, s)));

      agent.metadata.modified = Date.now();
      saveState();
      animateHodge();
    });

    // --- Bridge Creator ---
    document.getElementById('btn-generate-code').addEventListener('click', () => {
      const source = document.getElementById('bridge-source').value;
      const target = document.getElementById('bridge-target').value;
      const map = document.getElementById('bridge-map').value.split('\n');

      let code = `# Bridge from ${source} to ${target}\n`;
      code += `import json\nimport csv\n\n`;

      if (source === 'json' && target === 'csv') {
        code += `def json_to_csv(json_data, output_file):\n`;
        code += `    with open(output_file, 'w', newline='') as f:\n`;
        code += `        writer = csv.DictWriter(f, fieldnames=json_data[0].keys())\n`;
        code += `        writer.writeheader()\n`;
        code += `        for row in json_data:\n`;
        code += `            writer.writerow(row)\n`;
        code += `\n`;
        code += `# Example\n`;
        code += `data = ${map.length > 0 ? '[{"name": "John", "age": 30}]' : '[]'}\n`;
        code += `json_to_csv(data, "output.csv")\n`;
      } else if (source === 'csv' && target === 'json') {
        code += `def csv_to_json(csv_file, output_file):\n`;
        code += `    data = []\n`;
        code += `    with open(csv_file, 'r') as f:\n`;
        code += `        reader = csv.DictReader(f)\n`;
        code += `        for row in reader:\n`;
        code += `            data.append(row)\n`;
        code += `    with open(output_file, 'w') as f:\n`;
        code += `        json.dump(data, f, indent=2)\n`;
        code += `\n`;
        code += `# Example\n`;
        code += `csv_to_json("input.csv", "output.json")\n`;
      } else {
        code += `# Bridge not yet implemented for ${source} to ${target}\n`;
      }

      document.getElementById('bridge-preview').textContent = code;
    });

    // --- Session Management ---
    document.getElementById('btn-save-session').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `session-${Date.now()}.qzt`;
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('btn-load-session').addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.qzt';
      input.onchange = (e) => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const loaded = JSON.parse(event.target.result);
            state = loaded;
            saveState();
            loadState();
          } catch (err) {
            alert('Invalid session file');
          }
        };
        reader.readAsText(file);
      };
      input.click();
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      if (confirm('Reset all data?')) {
        localStorage.clear();
        state = {
          cells: [],
          agents: [],
          bridges: [],
          session: { timestamp: Date.now(), version: "0.0.1" }
        };
        saveState();
        loadState();
      }
    });

    // --- Visualizations ---
    function animateEchogram() {
      const echogram = document.getElementById('echogram');
      echogram.innerHTML = '';
      for (let i = 0; i < 12; i++) {
        const beam = document.createElement('div');
        beam.className = 'echobeam';
        const height = Math.random() * 30 + 10;
        beam.style.height = `${height}px`;
        beam.style.backgroundColor = `rgba(196, 168, 87, ${Math.random() * 0.5 + 0.3})`;
        echogram.appendChild(beam);
      }

      setTimeout(animateEchogram, 1500 + Math.random() * 1000);
    }

    function animateHodge() {
      const hodge = document.getElementById('hodge-visual');
      hodge.innerHTML = '';
      const agent = state.agents.find(a => a.name === document.getElementById('agent-name').value.trim());
      if (!agent || !agent.decomp) return;

      const { dAlpha, deltaBeta, h } = agent.decomp;
      const n = dAlpha.length;

      dAlpha.forEach((val, i) => {
        const vec = document.createElement('div');
        vec.className = 'hodge-vector';
        const x = (i / n) * 100;
        const y = 50 + (val * 30);
        vec.style.left = `${x}%`;
        vec.style.top = `${y}%`;
        hodge.appendChild(vec);
      });

      deltaBeta.forEach((val, i) => {
        const vec = document.createElement('div');
        vec.className = 'hodge-vector';
        const x = (i / n) * 100;
        const y = 50 + (val * 30);
        vec.style.left = `${x}%`;
        vec.style.top = `${y}%`;
        vec.style.backgroundColor = '#8f3e21';
        hodge.appendChild(vec);
      });

      const hvec = document.createElement('div');
      hvec.className = 'hodge-vector';
      hvec.style.left = '50%';
      hvec.style.top = `${50 + (h * 40)}%`;
      hvec.style.backgroundColor = '#4a7b4a';
      hodge.appendChild(hvec);
    }

    function renderCellGraph() {
      const graph = document.getElementById('cell-graph');
      graph.innerHTML = '';

      const cellMap = {};
      state.cells.forEach((cell, i) => {
        cellMap[cell.id] = { x: 20 + (i % 5) * 180, y: 20 + Math.floor(i / 5) * 120 };
      });

      Object.keys(cellMap).forEach(id => {
        const node = document.createElement('div');
        node.className = 'graph-node';
        node.style.left = `${cellMap[id].x}px`;
        node.style.top = `${cellMap[id].y}px`;
        node.title = id;
        graph.appendChild(node);
      });

      // Draw edges based on room links
      state.cells.forEach(cell => {
        if (cell.room) {
          const target = state.cells.find(c => c.id === cell.room);
          if (target) {
            const edge = document.createElement('div');
            edge.className = 'graph-edge';
            const dx = cellMap[target.id].x - cellMap[cell.id].x;
            const dy = cellMap[target.id].y - cellMap[cell.id].y;
            const len = Math.sqrt(dx * dx + dy * dy);
            const angle = Math.atan2(dy, dx);
            edge.style.width = `${len}px`;
            edge.style.left = `${cellMap[cell.id].x}px`;
            edge.style.top = `${cellMap[cell.id].y}px`;
            edge.style.transform = `rotate(${angle}rad)`;
            graph.appendChild(edge);
          }
        }
      });
    }

    // --- Event Listeners ---
    document.getElementById('cell-gamma').addEventListener('input', (e) => {
      document.getElementById('gamma-value').textContent = e.target.value;
    });

    document.getElementById('cell-vibe').addEventListener('input', (e) => {
      document.getElementById('vibe-value').textContent = e.target.value;
    });

    document.getElementById('cell-id').addEventListener('input', updateCellPreview);
    document.getElementById('cell-kind').addEventListener('input', updateCellPreview);
    document.getElementById('cell-value').addEventListener('input', updateCellPreview);
    document.getElementById('cell-formula').addEventListener('input', updateCellPreview);
    document.getElementById('cell-room').addEventListener('input', updateCellPreview);

    // --- Boot ---
    loadState();
  </script>
</body>
</html>
