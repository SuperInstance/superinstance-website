<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Cell as Garden</title>
  <style>
    :root {
      --bg: #0a111f;
      --text: #c8d3e0;
      --accent: #4a69a2;
      --highlight: #a8c4d2;
      --border: #2a3b52;
      --glow: #3a547d;
      --cell-bg: #131e34;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Courier New', monospace;
      line-height: 1.8;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 2rem 3rem;
      border-bottom: 1px solid var(--border);
      position: relative;
      z-index: 10;
      background: rgba(10, 17, 31, 0.95);
      backdrop-filter: blur(8px);
    }

    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.3rem;
      letter-spacing: 0.5px;
    }

    .header-title {
      font-weight: 700;
      color: var(--highlight);
      text-shadow: 0 0 10px var(--glow);
      letter-spacing: 1px;
    }

    .header-sub {
      font-size: 0.8rem;
      opacity: 0.7;
      font-style: italic;
    }

    .watch {
      font-size: 0.7rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
      background: rgba(74, 105, 162, 0.1);
      padding: 0.2rem 0.6rem;
      border-radius: 3px;
      border: 1px solid var(--accent);
    }

    .main {
      flex: 1;
      position: relative;
      overflow: hidden;
      padding: 2rem;
    }

    .garden-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      grid-gap: 1.5rem;
      padding: 2rem 0;
      height: 100%;
      position: relative;
    }

    .cell {
      background-color: var(--cell-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      min-height: 200px;
      position: relative;
      overflow: hidden;
      transition: all 0.6s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transform: translateY(0);
    }

    .cell:hover {
      transform: translateY(-10px) scale(1.02);
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.5);
      border-color: var(--highlight);
    }

    .cell::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 30%, rgba(64, 105, 162, 0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 1;
      opacity: 0.1;
    }

    .cell::after {
      content: '';
      position: absolute;
      top: 10%;
      left: 10%;
      width: 80%;
      height: 80%;
      border: 1px dashed var(--border);
      border-radius: 6px;
      opacity: 0.3;
      pointer-events: none;
      z-index: 2;
    }

    .cell-header {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--highlight);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .cell-id {
      font-size: 0.7rem;
      background: rgba(74, 105, 162, 0.2);
      padding: 0.2rem 0.5rem;
      border-radius: 3px;
      font-weight: 500;
    }

    .cell-content {
      flex: 1;
      font-size: 0.85rem;
      line-height: 1.6;
      position: relative;
      z-index: 3;
      margin-bottom: 0.8rem;
      overflow: hidden;
    }

    .bloom {
      display: inline-block;
      font-weight: 700;
      color: var(--accent);
      text-shadow: 0 0 8px var(--glow);
      transition: all 0.4s ease;
      letter-spacing: 0.5px;
      padding: 0 0.3rem;
      border-radius: 2px;
    }

    .bloom::after {
      content: '…';
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .bloom:hover::after {
      opacity: 1;
    }

    .cell-footer {
      font-size: 0.7rem;
      color: var(--accent);
      font-style: italic;
      text-align: right;
      opacity: 0.6;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
    }

    .cell-legend {
      position: absolute;
      bottom: 1rem;
      right: 1rem;
      font-size: 0.6rem;
      color: var(--highlight);
      opacity: 0.5;
      text-transform: uppercase;
      letter-spacing: 1px;
      z-index: 10;
    }

    .cell-legend::before {
      content: 'CELL';
      display: block;
      margin-bottom: 0.2rem;
    }

    .cell-legend::after {
      content: 'GARDEN';
      display: block;
    }

    .scrim {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 17, 31, 0.8);
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .cell:hover .scrim {
      opacity: 0.4;
    }

    .pulse {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(74, 105, 162, 0.1) 0%, transparent 70%);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      animation: pulse 4s infinite ease-out;
    }

    .cell:hover .pulse {
      opacity: 0.3;
    }

    @keyframes pulse {
      0% {
        transform: translate(-50%, -50%) scale(0.8);
        opacity: 0;
      }
      50% {
        opacity: 0.2;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.2);
        opacity: 0;
      }
    }

    footer {
      padding: 1rem 3rem;
      font-size: 0.7rem;
      color: var(--accent);
      text-align: center;
      border-top: 1px solid var(--border);
      opacity: 0.5;
      letter-spacing: 1px;
    }

    @media (max-width: 768px) {
      .header-content {
        flex-direction: column;
        text-align: center;
      }
      
      .header-sub {
        margin-top: 0.5rem;
      }
      
      .garden-container {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 1rem;
      }
      
      .cell {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <div class="header-title">
        The Cell as Garden
      </div>
      <div class="header-sub">
        Each cell is a garden. Each garden grows. The cell is the place where the bloom is seen.
      </div>
      <div class="watch">
        WATCH
      </div>
    </div>
  </header>

  <main class="main">
    <div class="garden-container" id="garden">
      <!-- Cells will be generated by JS -->
    </div>

    <div class="pulse"></div>
  </main>

  <footer>
    Iron sharpens iron. The cells federate. The room is a place. The cell is a place. The place is a cell. The room IS the cell.
  </footer>

  <script>
    // Generate cells dynamically
    const garden = document.getElementById('garden');
    const cellCount = 18;

    // Seed phrases for each cell/garden
    const seedPhrases = [
      "Roots trace invisible maps beneath the surface.",
      "Where silence hums, life begins.",
      "A single breath can bloom into a forest.",
      "Darkness is not absence, but potential.",
      "The first touch of dawn cracks through stone.",
      "Each cell remembers the sea.",
      "Fragments weave a narrative only time can read.",
      "Folds in the membrane hold ancient songs.",
      "Light passes through, but not untouched.",
      "The edge is not the boundary, but the threshold.",
      "What is buried grows louder than what is seen.",
      "Cells do not wait for permission to become.",
      "The pattern is in the pulse, not the form.",
      "A filament of thought connects across the void.",
      "Moisture remembers the shape of the seed.",
      "No cell is alone in its quiet becoming.",
      "The wall is not a limit, but a scaffold.",
      "Every cell is a lighthouse in the dark"
    ];

    // Create cells
    for (let i = 0; i < cellCount; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      
      const id = `CELL-${String(i + 1).padStart(3, '0')}`;
      
      const header = document.createElement('div');
      header.className = 'cell-header';
      
      const title = document.createElement('span');
      title.textContent = `Garden ${i + 1}`;
      
      const cellId = document.createElement('span');
      cellId.className = 'cell-id';
      cellId.textContent = id;
      
      header.appendChild(title);
      header.appendChild(cellId);
      
      const content = document.createElement('div');
      content.className = 'cell-content';
      
      const text = document.createElement('p');
      text.textContent = seedPhrases[i % seedPhrases.length];
      
      const bloom = document.createElement('span');
      bloom.className = 'bloom';
      bloom.textContent = 'bloom';
      
      text.appendChild(bloom);
      content.appendChild(text);
      
      const footer = document.createElement('div');
      footer.className = 'cell-footer';
      footer.textContent = 'Time: 00:00:00';
      
      const legend = document.createElement('div');
      legend.className = 'cell-legend';
      
      cell.appendChild(header);
      cell.appendChild(content);
      cell.appendChild(footer);
      cell.appendChild(legend);
      
      garden.appendChild(cell);
    }

    // Add real-time clock to footer
    const clock = document.querySelector('.cell-footer');
    const updateClock = () => {
      const now = new Date();
      const timeString = now.toTimeString().slice(0, 8);
      clock.textContent = `Time: ${timeString}`;
    };
    
    updateClock();
    setInterval(updateClock, 1000);

    // Add interactive elements
    const cells = document.querySelectorAll('.cell');
    
    cells.forEach((cell, index) => {
      // Add subtle animation on hover
      cell.addEventListener('mouseenter', () => {
        const bloom = cell.querySelector('.bloom');
        bloom.style.transform = 'scale(1.2)';
        bloom.style.color = '#68a7d6';
        bloom.style.textShadow = '0 0 12px #68a7d6';
      });
      
      cell.addEventListener('mouseleave', () => {
        const bloom = cell.querySelector('.bloom');
        bloom.style.transform = 'scale(1)';
        bloom.style.color = '#4a69a2';
        bloom.style.textShadow = '0 0 8px #3a547d';
      });
    });

    // Add floating effect to the main container
    document.addEventListener('mousemove', (e) => {
      const x = e.clientX / window.innerWidth;
      const y = e.clientY / window.innerHeight;
      
      const garden = document.querySelector('.garden-container');
      garden.style.transform = `translate(${x * 2 - 1}px, ${y * 2 - 1}px)`;
    });
  </script>
</body>
</html>
